<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#163d35">
<title>NutriProof — Comprendre les preuves</title>
<style>
:root{--ink:#17342e;--muted:#62736e;--bg:#f5f7f3;--card:#fff;--line:#dce5de;--accent:#276653;--soft:#e8f2ec;--amber:#fff4d9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#163d35;color:white;padding:22px 18px 26px} .top{max-width:960px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:1.35rem;letter-spacing:-.04em}.brand span{color:#a7d7b8}
select,button,input{font:inherit}select{border:1px solid #b8cec2;border-radius:10px;padding:8px;background:white;color:var(--ink)}
.hero{max-width:960px;margin:24px auto 0;padding:0 18px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:#bce2c9;font-weight:700}
h1{font-size:clamp(2rem,5vw,3.25rem);line-height:1.05;letter-spacing:-.045em;max-width:700px;margin:10px 0 14px}.hero p{max-width:660px;color:#d6e7df;margin:0}
main{max-width:960px;margin:26px auto;padding:0 18px 50px}.searchbox{display:flex;gap:10px;margin-top:-2px}.searchbox input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:14px 15px;background:white}.searchbox button,.primary{border:0;background:var(--accent);color:white;border-radius:12px;padding:12px 17px;font-weight:700;cursor:pointer}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}.chip{border:1px solid var(--line);background:white;color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer}.chip.active{background:var(--soft);border-color:#9bbfac;font-weight:700}
.layout{display:grid;grid-template-columns:1fr 1.35fr;gap:18px}.panel,.detail{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}.panel h2,.detail h2{margin:0 0 12px;font-size:1.1rem}.result{width:100%;text-align:left;background:white;border:1px solid var(--line);border-radius:12px;padding:13px;margin:7px 0;cursor:pointer;color:var(--ink)}.result:hover,.result.selected{border-color:var(--accent);background:#f3faf5}.result strong{display:block}.result small{color:var(--muted)}.pill{display:inline-block;font-size:.75rem;border-radius:999px;background:var(--soft);padding:4px 8px;color:#245a46;font-weight:700}.pill.caution{background:var(--amber);color:#765512}.muted{color:var(--muted)}.section{border-top:1px solid var(--line);padding:14px 0}.section h3{font-size:.95rem;margin:0 0 5px}.sources a{display:block;overflow-wrap:anywhere;color:var(--accent);margin:5px 0}.notice{background:#fff7e4;border:1px solid #f0dfb1;border-radius:12px;padding:12px 14px;font-size:.87rem;margin-top:16px}.method{font-size:.88rem;background:#edf3ef;border-radius:12px;padding:12px;margin-top:14px}.footer{font-size:.8rem;color:var(--muted);margin-top:24px}.empty{padding:18px;color:var(--muted)}@media(max-width:700px){.layout{grid-template-columns:1fr}.searchbox{flex-direction:column}.searchbox button{width:100%}.top{align-items:flex-start}}
</style>
</head>
<body>
<header>
  <div class="top"><div class="brand">Nutri<span>Proof</span></div><label><span id="langLabel" style="font-size:.8rem;margin-right:6px">Langue</span><select id="language" aria-label="Language"><option value="fr">Français</option><option value="en">English</option></select></label></div>
  <div class="hero"><div class="eyebrow" id="eyebrow">Des preuves, pas des promesses</div><h1 id="headline">Comprenez ce que la science dit vraiment des suppléments.</h1><p id="intro">Des fiches transparentes, des limites clairement expliquées et des sources consultables. Pas de classement sponsorisé.</p></div>
</header>
<main>
  <div class="searchbox"><input id="search" type="search" placeholder="Rechercher un ingrédient (ex. créatine, magnésium)…" aria-label="Search ingredients"><button id="searchBtn">Rechercher</button></div>
  <div class="filters" id="filters"></div>
  <div class="layout">
    <section class="panel"><h2 id="resultsTitle">Ingrédients</h2><div id="results"></div></section>
    <article class="detail" id="detail" aria-live="polite"></article>
  </div>
  <div class="notice" id="safety"></div>
  <div class="method" id="method"></div>
  <div class="footer" id="footer"></div>
</main>
<script>
const db = [
 {id:"creatine", names:{fr:"Créatine monohydrate",en:"Creatine monohydrate"}, aliases:["creatine","créatine","monohydrate"], category:"performance", status:"review", certainty:"moderate", claim:{fr:"La créatine monohydrate est l’un des suppléments les mieux étudiés pour améliorer la capacité à répéter des efforts intenses et soutenir les gains de force et de masse maigre lorsqu’elle est associée à l’entraînement.",en:"Creatine monohydrate is one of the best-studied supplements for improving repeated high-intensity exercise capacity and supporting strength and lean-mass gains when combined with training."}, limits:{fr:"L’ampleur de l’effet dépend du type d’exercice, du programme et de la personne. Une hausse initiale du poids peut notamment refléter davantage d’eau dans les muscles. La source principale est une prise de position scientifique, pas une revue systématique indépendante récente.",en:"Effect size depends on exercise type, training programme and individual. An early increase in body weight can partly reflect increased water stored in muscle. The key source is a scientific position stand, not a recent independent systematic review."}, safety:{fr:"Des troubles digestifs sont possibles. En cas de maladie rénale, de grossesse, de traitement ou de situation médicale particulière, demander conseil à un professionnel de santé. La sécurité chez des personnes en bonne santé ne doit pas être extrapolée à tous les contextes.",en:"Digestive symptoms can occur. People with kidney disease, those who are pregnant, or anyone taking medicines or with a relevant medical condition should seek professional advice. Safety in healthy people should not be extrapolated to every situation."}, sources:[{label:"ISSN position stand — Creatine supplementation (2017; full text)",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC5469049/"},{label:"NIH ODS — Dietary Supplements for Exercise and Athletic Performance",url:"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"}]},
 {id:"magnesium", names:{fr:"Magnésium",en:"Magnesium"}, aliases:["magnesium","magnésium","glycinate","citrate"], category:"nutrients", status:"review", certainty:"not_assessed", claim:{fr:"Le magnésium est essentiel au fonctionnement normal de l’organisme. Un supplément peut être utile lorsque les apports sont insuffisants ou dans certaines indications, mais cela ne prouve pas qu’il améliore systématiquement le sommeil, l’énergie ou les performances chez toute personne.",en:"Magnesium is essential for normal body function. Supplementation may help when intake is inadequate or for specific indications, but this does not show that it routinely improves sleep, energy or performance in everyone."}, limits:{fr:"Les effets dépendent de l’état nutritionnel, de la dose, de la forme et du résultat étudié. Les taux sanguins ne reflètent pas parfaitement les réserves totales de magnésium.",en:"Effects depend on nutritional status, dose, formulation and outcome studied. Blood levels do not perfectly reflect total body magnesium stores."}, safety:{fr:"Les suppléments peuvent provoquer diarrhée et crampes abdominales. Le risque d’accumulation augmente en cas d’insuffisance rénale. Le magnésium peut interagir avec certains antibiotiques et bisphosphonates; vérifier les espacements avec un pharmacien.",en:"Supplements can cause diarrhoea and abdominal cramps. Accumulation risk increases with kidney impairment. Magnesium can interact with some antibiotics and bisphosphonates; ask a pharmacist about dose spacing."}, sources:[{label:"NIH ODS — Magnesium: Health Professional Fact Sheet",url:"https://ods.od.nih.gov/factsheets/Magnesium-HealthProfessional/"}]},
 {id:"glutamine", names:{fr:"Glutamine",en:"Glutamine"}, aliases:["glutamine","l-glutamine","l glutamine"], category:"performance", status:"review", certainty:"low", claim:{fr:"La glutamine est un acide aminé abondant dans le corps. Chez les adultes en bonne santé qui s’entraînent, les preuves ne montrent pas de manière convaincante qu’un supplément améliore systématiquement la prise de muscle ou la performance sportive.",en:"Glutamine is an abundant amino acid in the body. In healthy exercising adults, evidence does not convincingly show that supplementation consistently improves muscle gain or athletic performance."}, limits:{fr:"Les résultats varient selon les populations et les contextes cliniques. Un rôle biologique important de la glutamine ne signifie pas qu’une supplémentation apporte un bénéfice supplémentaire. Cette synthèse est indicative et ne constitue pas une revue systématique.",en:"Results vary across populations and clinical settings. An important biological role for glutamine does not mean supplementation provides extra benefit. This is an indicative summary, not a systematic review."}, safety:{fr:"La sécurité et l’utilité dépendent du contexte médical, de la dose et des autres traitements. En cas de maladie chronique, grossesse ou traitement médicamenteux, demander un avis professionnel avant usage.",en:"Safety and usefulness depend on medical context, dose and other treatments. People with chronic illness, those who are pregnant, or those taking medicines should seek professional advice before use."}, sources:[{label:"NIH PubMed — Search for clinical reviews on glutamine and exercise",url:"https://pubmed.ncbi.nlm.nih.gov/?term=glutamine+supplementation+exercise+systematic+review"}]},
 {id:"omega3", names:{fr:"Oméga-3 (EPA/DHA/ALA)",en:"Omega-3 (EPA/DHA/ALA)"}, aliases:["omega 3","oméga-3","omega-3","epa","dha","ala","huile de poisson","algae"], category:"nutrients", status:"review", certainty:"not_assessed", claim:{fr:"Les oméga-3 ne sont pas tous identiques : l’ALA provient notamment de graines et d’huiles végétales, tandis que l’EPA et le DHA se trouvent surtout dans les poissons gras et certaines huiles d’algues. Les effets d’un supplément dépendent de l’indication et de la formulation.",en:"Omega-3s are not interchangeable: ALA comes from sources such as seeds and plant oils, while EPA and DHA are found mainly in oily fish and some algal oils. Supplement effects depend on the indication and formulation."}, limits:{fr:"Les résultats observés pour un médicament à base d’oméga-3 ou une population à risque ne s’appliquent pas automatiquement aux compléments courants ni à la prévention chez tout adulte en bonne santé.",en:"Findings for prescription omega-3 medicines or high-risk populations do not automatically apply to ordinary supplements or prevention in every healthy adult."}, safety:{fr:"Des troubles digestifs sont possibles. À fortes doses, les oméga-3 peuvent interagir avec les anticoagulants ou les traitements de la tension. Vérifier la quantité d’EPA et de DHA, pas seulement le poids total d’huile.",en:"Digestive symptoms can occur. At high doses, omega-3s may interact with anticoagulants or blood-pressure medicines. Check the EPA and DHA amounts, not only the total oil weight."}, sources:[{label:"NIH ODS — Omega-3 Fatty Acids: Health Professional Fact Sheet",url:"https://ods.od.nih.gov/factsheets/Omega3FattyAcids-HealthProfessional/"}]},
 {id:"vitamind", names:{fr:"Vitamine D",en:"Vitamin D"}, aliases:["vitamine d","vitamin d","d3","cholecalciferol","cholécalciférol"], category:"nutrients", status:"review", certainty:"not_assessed", claim:{fr:"La vitamine D contribue notamment à l’absorption du calcium et à la santé osseuse. Une supplémentation est particulièrement pertinente en cas d’apports insuffisants ou de risque de déficit; davantage n’est pas forcément mieux lorsque le statut est déjà adéquat.",en:"Vitamin D helps, among other roles, with calcium absorption and bone health. Supplementation is particularly relevant when intake is inadequate or deficiency risk is present; more is not necessarily better when status is already adequate."}, limits:{fr:"Les effets dépendent du statut initial, de la dose, de la durée et du résultat évalué. Les bénéfices démontrés pour corriger un déficit ne prouvent pas que de fortes doses préviennent toutes les maladies.",en:"Effects depend on baseline status, dose, duration and the outcome assessed. Benefits for correcting deficiency do not prove that high doses prevent every disease."}, safety:{fr:"Des doses excessives peuvent entraîner une hypercalcémie et des atteintes rénales. Éviter les fortes doses prolongées sans indication et avis professionnel; tenir compte des autres produits contenant de la vitamine D.",en:"Excessive doses can cause hypercalcaemia and kidney injury. Avoid prolonged high doses without an indication and professional advice; account for other products containing vitamin D."}, sources:[{label:"NIH ODS — Vitamin D: Health Professional Fact Sheet",url:"https://ods.od.nih.gov/factsheets/VitaminD-HealthProfessional/"}]},
 {id:"ashwagandha", names:{fr:"Ashwagandha",en:"Ashwagandha"}, aliases:["ashwagandha","withania","withania somnifera"], category:"herbs", status:"review", certainty:"low", claim:{fr:"Certaines petites études suggèrent une possible amélioration du stress perçu ou du sommeil avec certaines préparations, sur des périodes limitées. Les résultats ne permettent pas de conclure que tous les produits se valent.",en:"Some small studies suggest possible improvements in perceived stress or sleep with certain preparations over limited periods. Results do not establish that all products are equivalent."}, limits:{fr:"Les extraits, doses, durées et méthodes varient; les études sont souvent petites et de courte durée. Les résultats ne s’appliquent pas nécessairement aux autres produits commerciaux.",en:"Extracts, doses, durations and methods vary; studies are often small and short-term. Results may not apply to other commercial products."}, safety:{fr:"Des effets indésirables digestifs et une somnolence sont possibles; de rares atteintes hépatiques ont été signalées. Des interactions sont possibles, notamment avec certains médicaments. Éviter pendant la grossesse et demander conseil en cas de maladie thyroïdienne, hépatique ou auto-immune.",en:"Digestive effects and drowsiness are possible; rare liver injuries have been reported. Interactions may occur with some medicines. Avoid during pregnancy and seek advice with thyroid, liver or autoimmune conditions."}, sources:[{label:"NCCIH — Ashwagandha: Usefulness and Safety",url:"https://www.nccih.nih.gov/health/ashwagandha"}]}
];
let activeCategory="all", selectedId="creatine";
const copy={
 fr:{lang:"Langue",eyebrow:"Des preuves, pas des promesses",headline:"Comprenez ce que la science dit vraiment des suppléments.",intro:"Des fiches transparentes, des limites clairement expliquées et des sources consultables. Pas de classement sponsorisé.",placeholder:"Rechercher un ingrédient (ex. créatine, magnésium)…",search:"Rechercher",results:"Ingrédients",all:"Tous",performance:"Performance",nutrients:"Nutriments",herbs:"Plantes",claim:"Ce que les données suggèrent",limits:"Limites des preuves",safety:"Sécurité et précautions",sources:"Sources de référence",moderate:"Niveau indicatif : preuves favorables, à vérifier",low:"Niveau indicatif : preuves limitées",not_assessed:"Certitude non évaluée formellement",empty:"Aucun résultat. Essayez un autre terme.",notice:"Information générale uniquement — ne constitue ni un diagnostic ni une recommandation personnalisée. Les fiches de cette première maquette sont des exemples préliminaires et ne doivent pas être utilisées pour prendre une décision médicale. Vérifiez les sources et demandez conseil à un médecin ou à un pharmacien en cas de traitement, de maladie, de grossesse ou de doute.",method:"Méthode : chaque affirmation doit être reliée à des sources consultables, avec population, résultat, limites et date de révision. Les niveaux de certitude affichés ici sont provisoires. Une classification formelle nécessitera une méthode documentée, une évaluation du risque de biais et une relecture.",footer:"Prototype de démonstration • Pas de compte, pas de suivi médical, pas de publicité ni de liens affiliés dans cette version.",review:"Statut : synthèse préliminaire à vérifier",category:"Catégorie"},
 en:{lang:"Language",eyebrow:"Evidence, not promises",headline:"Understand what science really says about supplements.",intro:"Transparent summaries, clear limitations and sources you can check. No sponsored rankings.",placeholder:"Search an ingredient (e.g. creatine, magnesium)…",search:"Search",results:"Ingredients",all:"All",performance:"Performance",nutrients:"Nutrients",herbs:"Herbs",claim:"What the evidence suggests",limits:"Evidence limitations",safety:"Safety and precautions",sources:"Reference sources",moderate:"Indicative level: supportive evidence, verify",low:"Indicative level: limited evidence",not_assessed:"Certainty not formally assessed",empty:"No results. Try another term.",notice:"General information only — not a diagnosis or personalized recommendation. Cards in this first mock-up are preliminary examples and should not be used to make medical decisions. Check the sources and consult a doctor or pharmacist if you take medicines, have a condition, are pregnant, or are unsure.",method:"Method: each claim should link to checkable sources and document population, outcome, limitations and review date. Certainty labels shown here are provisional. Formal grading requires a documented method, risk-of-bias assessment and review.",footer:"Demonstration prototype • No accounts, medical tracking, ads or affiliate links in this version.",review:"Status: preliminary summary to verify",category:"Category"}
};
function t(k){return copy[document.getElementById("language").value][k]}
function catName(c){return t(c)}
function setLanguage(){let l=document.getElementById("language").value;document.documentElement.lang=l;["langLabel","eyebrow","headline","intro","searchBtn","resultsTitle","safety","method","footer"].forEach(id=>{let key={langLabel:"lang",searchBtn:"search",resultsTitle:"results"}[id]||id; if(copy[l][key])document.getElementById(id).textContent=copy[l][key]});document.getElementById("search").placeholder=copy[l].placeholder;renderFilters();renderResults();renderDetail()}
function renderFilters(){let box=document.getElementById("filters");let cats=["all","performance","nutrients","herbs"];box.innerHTML="";cats.forEach(c=>{let b=document.createElement("button");b.className="chip"+(activeCategory===c?" active":"");b.textContent=t(c);b.onclick=()=>{activeCategory=c;renderFilters();renderResults()};box.appendChild(b)})}
function visible(){let q=document.getElementById("search").value.trim().toLowerCase();return db.filter(x=>(activeCategory==="all"||x.category===activeCategory)&&(!q||[x.names.fr,x.names.en,...x.aliases].join(" ").toLowerCase().includes(q)))}
function renderResults(){let box=document.getElementById("results");box.innerHTML="";let rows=visible();if(!rows.length){box.innerHTML='<div class="empty">'+t("empty")+'</div>';return}rows.forEach(x=>{let b=document.createElement("button");b.className="result"+(x.id===selectedId?" selected":"");let title=document.createElement("strong");title.textContent=x.names[document.getElementById("language").value];let small=document.createElement("small");small.textContent=catName(x.category);b.append(title,small);b.onclick=()=>{selectedId=x.id;renderResults();renderDetail()};box.appendChild(b)})}
function renderDetail(){let x=db.find(x=>x.id===selectedId)||db[0],l=document.getElementById("language").value;let certainty=x.certainty==="moderate"?t("moderate"):x.certainty==="low"?t("low"):t("not_assessed");let d=document.getElementById("detail");d.innerHTML="";let title=document.createElement("h2");title.textContent=x.names[l];let pill=document.createElement("span");pill.className="pill caution";pill.textContent=t("review");d.append(title,pill);
function section(h,txt){let s=document.createElement("div");s.className="section";let hh=document.createElement("h3");hh.textContent=h;let p=document.createElement("p");p.textContent=txt;s.append(hh,p);d.appendChild(s)}
let c=document.createElement("div");c.className="section";let ch=document.createElement("h3");ch.textContent=t("claim");let cp=document.createElement("p");cp.textContent=x.claim[l];let badge=document.createElement("div");badge.className="pill";badge.textContent=certainty;c.append(ch,cp,badge);d.appendChild(c);
section(t("limits"),x.limits[l]);section(t("safety"),x.safety[l]);
let s=document.createElement("div");s.className="section sources";let h=document.createElement("h3");h.textContent=t("sources");s.appendChild(h);x.sources.forEach(src=>{let a=document.createElement("a");a.href=src.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=src.label;a.setAttribute("aria-label",src.label+" (opens in new tab)");s.appendChild(a)});d.appendChild(s);
}
document.getElementById("language").addEventListener("change",setLanguage);
document.getElementById("search").addEventListener("input",renderResults);
document.getElementById("searchBtn").addEventListener("click",renderResults);
setLanguage();
</script>
</body>
</html>
