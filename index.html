<script>
const db = [
 {id:"creatine", names:{fr:"Créatine monohydrate",en:"Creatine monohydrate",pt:"Creatina monohidratada"}, aliases:["creatine","créatine","monohydrate","creatina"], timing:{fr:"Le moment exact importe peu : choisissez une heure facile à tenir et prenez-la régulièrement. Avec un repas ou sans repas selon la tolérance; si l’estomac est sensible, prenez-la avec de la nourriture. La régularité est mieux étayée que l’idée d’une fenêtre obligatoire après l’entraînement.",en:"Exact timing matters little: choose an easy time and take it consistently. With or without food according to tolerance; if your stomach is sensitive, take it with a meal. Consistency is better supported than a mandatory post-workout window.",pt:"A hora exata importa pouco: escolha um horário fácil de manter e tome-a regularmente. Pode ser com ou sem comida, conforme a tolerância; se causar desconforto gástrico, tome com uma refeição. A regularidade tem mais fundamento do que uma janela obrigatória após o treino."}, category:"performance", status:"review", certainty:"moderate", claim:{fr:"La créatine monohydrate est l’un des suppléments les mieux étudiés pour améliorer la capacité à répéter des efforts intenses et soutenir les gains de force et de masse maigre lorsqu’elle est associée à l’entraînement.",en:"Creatine monohydrate is one of the best-studied supplements for improving repeated high-intensity exercise capacity and supporting strength and lean-mass gains when combined with training."}, limits:{fr:"L’ampleur de l’effet dépend du type d’exercice, du programme et de la personne. Une hausse initiale du poids peut notamment refléter davantage d’eau dans les muscles. La source principale est une prise de position scientifique, pas une revue systématique indépendante récente.",en:"Effect size depends on exercise type, training programme and individual. An early increase in body weight can partly reflect increased water stored in muscle. The key source is a scientific position stand, not a recent independent systematic review."}, safety:{fr:"Des troubles digestifs sont possibles. En cas de maladie rénale, de grossesse, de traitement ou de situation médicale particulière, demander conseil à un professionnel de santé. La sécurité chez des personnes en bonne santé ne doit pas être extrapolée à tous les contextes.",en:"Digestive symptoms can occur. People with kidney disease, those who are pregnant, or anyone taking medicines or with a relevant medical condition should seek professional advice. Safety in healthy people should not be extrapolated to every situation."}, sources:[{label:"ISSN position stand — Creatine supplementation (2017; full text)",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC5469049/"},{label:"NIH ODS — Dietary Supplements for Exercise and Athletic Performance",url:"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"}]},
 {id:"magnesium", names:{fr:"Magnésium",en:"Magnesium",pt:"Magnésio"}, aliases:["magnesium","magnésium","glycinate","citrate","magnésio"], timing:{fr:"Il n’existe pas d’heure universelle optimale. Prenez-le à un moment régulier; avec un repas peut améliorer la tolérance digestive. Le soir n’est pas démontré comme supérieur pour tout le monde. Respectez les consignes du produit et l’espacement avec certains médicaments.",en:"There is no universally optimal time. Take it at a consistent time; taking it with food may improve digestive tolerance. Evening use has not been shown to be better for everyone. Follow product directions and separate it from certain medicines when advised.",pt:"Não existe uma hora ideal para toda a gente. Tome-o num horário regular; fazê-lo com uma refeição pode melhorar a tolerância digestiva. Não está demonstrado que à noite seja melhor para todos. Siga as instruções do produto e respeite o intervalo em relação a certos medicamentos."}, category:"nutrients", status:"review", certainty:"not_assessed", claim:{fr:"Le magnésium est essentiel au fonctionnement normal de l’organisme. Un supplément peut être utile lorsque les apports sont insuffisants ou dans certaines indications, mais cela ne prouve pas qu’il améliore systématiquement le sommeil, l’énergie ou les performances chez toute personne.",en:"Magnesium is essential for normal body function. Supplementation may help when intake is inadequate or for specific indications, but this does not show that it routinely improves sleep, energy or performance in everyone."}, limits:{fr:"Les effets dépendent de l’état nutritionnel, de la dose, de la forme et du résultat étudié. Les taux sanguins ne reflètent pas parfaitement les réserves totales de magnésium.",en:"Effects depend on nutritional status, dose, formulation and outcome studied. Blood levels do not perfectly reflect total body magnesium stores."}, safety:{fr:"Les suppléments peuvent provoquer diarrhée et crampes abdominales. Le risque d’accumulation augmente en cas d’insuffisance rénale. Le magnésium peut interagir avec certains antibiotiques et bisphosphonates; vérifier les espacements avec un pharmacien.",en:"Supplements can cause diarrhoea and abdominal cramps. Accumulation risk increases with kidney impairment. Magnesium can interact with some antibiotics and bisphosphonates; ask a pharmacist about dose spacing."}, sources:[{label:"NIH ODS — Magnesium: Health Professional Fact Sheet",url:"https://ods.od.nih.gov/factsheets/Magnesium-HealthProfessional/"}]},
 {id:"glutamine", names:{fr:"Glutamine",en:"Glutamine",pt:"Glutamina"}, aliases:["glutamine","l-glutamine","l glutamine","glutamina"], timing:{fr:"Pour les adultes en bonne santé, aucun moment précis n’a démontré un bénéfice sportif fiable. Si vous l’utilisez, suivez l’étiquette et choisissez un horaire toléré; la prise avant ou après l’entraînement n’a pas de supériorité clairement établie.",en:"For healthy adults, no specific timing has shown a reliable sports benefit. If you use it, follow the label and choose a time you tolerate; taking it before or after exercise has no clearly established advantage.",pt:"Em adultos saudáveis, não há um horário específico que tenha demonstrado um benefício desportivo fiável. Se a utilizar, siga o rótulo e escolha um horário bem tolerado; não está claramente demonstrado que tomar antes ou depois do treino seja superior."}, category:"performance", status:"review", certainty:"low", claim:{fr:"La glutamine est un acide aminé abondant dans le corps. Chez les adultes en bonne santé qui s’entraînent, les preuves ne montrent pas de manière convaincante qu’un supplément améliore systématiquement la prise de muscle ou la performance sportive.",en:"Glutamine is an abundant amino acid in the body. In healthy exercising adults, evidence does not convincingly show that supplementation consistently improves muscle gain or athletic performance."}, limits:{fr:"Les résultats varient selon les populations et les contextes cliniques. Un rôle biologique important de la glutamine ne signifie pas qu’une supplémentation apporte un bénéfice supplémentaire. Cette synthèse est indicative et ne constitue pas une revue systématique.",en:"Results vary across populations and clinical settings. An important biological role for glutamine does not mean supplementation provides extra benefit. This is an indicative summary, not a systematic review."}, safety:{fr:"La sécurité et l’utilité dépendent du contexte médical, de la dose et des autres traitements. En cas de maladie chronique, grossesse ou traitement médicamenteux, demander un avis professionnel avant usage.",en:"Safety and usefulness depend on medical context, dose and other treatments. People with chronic illness, those who are pregnant, or those taking medicines should seek professional advice before use."}, sources:[{label:"NIH PubMed — Search for clinical reviews on glutamine and exercise",url:"https://pubmed.ncbi.nlm.nih.gov/?term=glutamine+supplementation+exercise+systematic+review"}]},
 {id:"omega3", names:{fr:"Oméga-3 (EPA/DHA/ALA)",en:"Omega-3 (EPA/DHA/ALA)",pt:"Ómega-3 (EPA/DHA/ALA)"}, aliases:["omega 3","oméga-3","omega-3","epa","dha","ala","huile de poisson","algae","ómega","omega","oleo de peixe","óleo de peixe"], timing:{fr:"Prenez-le avec un repas, idéalement contenant un peu de matière grasse, pour faciliter la tolérance et l’absorption. Aucun horaire universel (matin ou soir) n’est supérieur; la dose et l’indication comptent davantage.",en:"Take it with a meal, ideally containing some fat, to support tolerance and absorption. No universal time (morning or evening) is superior; dose and indication matter more.",pt:"Tome-o com uma refeição, idealmente com alguma gordura, para favorecer a tolerância e a absorção. Não há prova de que manhã ou noite seja universalmente melhor; a dose e a indicação são mais importantes."}, category:"nutrients", status:"review", certainty:"not_assessed", claim:{fr:"Les oméga-3 ne sont pas tous identiques : l’ALA provient notamment de graines et d’huiles végétales, tandis que l’EPA et le DHA se trouvent surtout dans les poissons gras et certaines huiles d’algues. Les effets d’un supplément dépendent de l’indication et de la formulation.",en:"Omega-3s are not interchangeable: ALA comes from sources such as seeds and plant oils, while EPA and DHA are found mainly in oily fish and some algal oils. Supplement effects depend on the indication and formulation."}, limits:{fr:"Les résultats observés pour un médicament à base d’oméga-3 ou une population à risque ne s’appliquent pas automatiquement aux compléments courants ni à la prévention chez tout adulte en bonne santé.",en:"Findings for prescription omega-3 medicines or high-risk populations do not automatically apply to ordinary supplements or prevention in every healthy adult."}, safety:{fr:"Des troubles digestifs sont possibles. À fortes doses, les oméga-3 peuvent interagir avec les anticoagulants ou les traitements de la tension. Vérifier la quantité d’EPA et de DHA, pas seulement le poids total d’huile.",en:"Digestive symptoms can occur. At high doses, omega-3s may interact with anticoagulants or blood-pressure medicines. Check the EPA and DHA amounts, not only the total oil weight."}, sources:[{label:"NIH ODS — Omega-3 Fatty Acids: Health Professional Fact Sheet",url:"https://ods.od.nih.gov/factsheets/Omega3FattyAcids-HealthProfessional/"}]},
 {id:"vitamind", names:{fr:"Vitamine D",en:"Vitamin D",pt:"Vitamina D"}, aliases:["vitamine d","vitamin d","d3","cholecalciferol","cholécalciférol","vitamina d"], timing:{fr:"Prenez-la avec un repas contenant un peu de graisse, car la vitamine D est liposoluble. Il n’existe pas d’heure de la journée universellement optimale. La dose doit tenir compte des apports, du risque de déficit et, si nécessaire, d’un avis professionnel.",en:"Take it with a meal containing some fat because vitamin D is fat-soluble. There is no universally optimal time of day. Dose should reflect intake, deficiency risk and, when needed, professional advice.",pt:"Tome-a com uma refeição que contenha alguma gordura, porque a vitamina D é lipossolúvel. Não existe uma hora do dia universalmente ideal. A dose deve considerar a alimentação, o risco de défice e, quando necessário, aconselhamento profissional."}, category:"nutrients", status:"review", certainty:"not_assessed", claim:{fr:"La vitamine D contribue notamment à l’absorption du calcium et à la santé osseuse. Une supplémentation est particulièrement pertinente en cas d’apports insuffisants ou de risque de déficit; davantage n’est pas forcément mieux lorsque le statut est déjà adéquat.",en:"Vitamin D helps, among other roles, with calcium absorption and bone health. Supplementation is particularly relevant when intake is inadequate or deficiency risk is present; more is not necessarily better when status is already adequate."}, limits:{fr:"Les effets dépendent du statut initial, de la dose, de la durée et du résultat évalué. Les bénéfices démontrés pour corriger un déficit ne prouvent pas que de fortes doses préviennent toutes les maladies.",en:"Effects depend on baseline status, dose, duration and the outcome assessed. Benefits for correcting deficiency do not prove that high doses prevent every disease."}, safety:{fr:"Des doses excessives peuvent entraîner une hypercalcémie et des atteintes rénales. Éviter les fortes doses prolongées sans indication et avis professionnel; tenir compte des autres produits contenant de la vitamine D.",en:"Excessive doses can cause hypercalcaemia and kidney injury. Avoid prolonged high doses without an indication and professional advice; account for other products containing vitamin D."}, sources:[{label:"NIH ODS — Vitamin D: Health Professional Fact Sheet",url:"https://ods.od.nih.gov/factsheets/VitaminD-HealthProfessional/"}]},
 {id:"ashwagandha", names:{fr:"Ashwagandha",en:"Ashwagandha",pt:"Ashwagandha"}, aliases:["ashwagandha","withania","withania somnifera"], timing:{fr:"Les études ne définissent pas d’heure optimale. Selon le produit et la tolérance, certaines personnes la prennent avec un repas; si elle provoque de la somnolence, évitez les activités nécessitant de la vigilance. La sécurité et les interactions priment sur l’horaire.",en:"Studies do not establish an optimal time. Depending on the product and tolerance, some take it with a meal; if it causes drowsiness, avoid activities requiring alertness. Safety and interactions matter more than timing.",pt:"Os estudos não estabelecem uma hora ideal. Dependendo do produto e da tolerância, algumas pessoas tomam-na com uma refeição; se causar sonolência, evite atividades que exijam atenção. A segurança e as interações são mais importantes do que o horário."}, category:"herbs", status:"review", certainty:"low", claim:{fr:"Certaines petites études suggèrent une possible amélioration du stress perçu ou du sommeil avec certaines préparations, sur des périodes limitées. Les résultats ne permettent pas de conclure que tous les produits se valent.",en:"Some small studies suggest possible improvements in perceived stress or sleep with certain preparations over limited periods. Results do not establish that all products are equivalent."}, limits:{fr:"Les extraits, doses, durées et méthodes varient; les études sont souvent petites et de courte durée. Les résultats ne s’appliquent pas nécessairement aux autres produits commerciaux.",en:"Extracts, doses, durations and methods vary; studies are often small and short-term. Results may not apply to other commercial products."}, safety:{fr:"Des effets indésirables digestifs et une somnolence sont possibles; de rares atteintes hépatiques ont été signalées. Des interactions sont possibles, notamment avec certains médicaments. Éviter pendant la grossesse et demander conseil en cas de maladie thyroïdienne, hépatique ou auto-immune.",en:"Digestive effects and drowsiness are possible; rare liver injuries have been reported. Interactions may occur with some medicines. Avoid during pregnancy and seek advice with thyroid, liver or autoimmune conditions."}, sources:[{label:"NCCIH — Ashwagandha: Usefulness and Safety",url:"https://www.nccih.nih.gov/health/ashwagandha"}]}
];

const ptTranslations={
creatine:{claim:"A creatina monohidratada é um dos suplementos mais estudados para melhorar a capacidade de repetir esforços intensos e apoiar ganhos de força e massa magra quando combinada com treino.",limits:"A dimensão do efeito depende do exercício, do programa e da pessoa. O aumento inicial de peso pode refletir maior quantidade de água nos músculos. A fonte principal é uma posição científica, não uma revisão sistemática independente recente.",safety:"Podem ocorrer efeitos digestivos. Em caso de doença renal, gravidez, medicação ou condição médica relevante, peça aconselhamento profissional. Os dados de segurança em pessoas saudáveis não se aplicam automaticamente a todas as situações."},
magnesium:{claim:"O magnésio é essencial ao funcionamento normal do organismo. Um suplemento pode ser útil quando a ingestão é insuficiente ou em indicações específicas, mas isso não prova que melhore sempre o sono, a energia ou o desempenho.",limits:"Os efeitos dependem do estado nutricional, da dose, da forma e do resultado avaliado. Os níveis no sangue não refletem perfeitamente as reservas totais de magnésio.",safety:"Os suplementos podem causar diarreia e cólicas abdominais. O risco de acumulação aumenta em caso de insuficiência renal. O magnésio pode interagir com alguns antibióticos e bifosfonatos; confirme com um farmacêutico os intervalos necessários."},
glutamine:{claim:"A glutamina é um aminoácido abundante no organismo. Em adultos saudáveis que treinam, a evidência não demonstra de forma convincente que a suplementação melhore consistentemente o ganho muscular ou o desempenho desportivo.",limits:"Os resultados variam entre populações e contextos clínicos. Uma função biológica importante da glutamina não significa que a suplementação traga benefício adicional. Esta é uma síntese indicativa, não uma revisão sistemática.",safety:"A segurança e a utilidade dependem do contexto médico, da dose e de outros tratamentos. Em caso de doença crónica, gravidez ou medicação, procure aconselhamento profissional antes de usar."},
omega3:{claim:"Os ómega-3 não são todos iguais: o ALA existe, por exemplo, em sementes e óleos vegetais; o EPA e o DHA encontram-se sobretudo em peixes gordos e em alguns óleos de algas. Os efeitos dos suplementos dependem da indicação e da formulação.",limits:"Os resultados de medicamentos com ómega-3 sujeitos a receita ou de populações de risco não se aplicam automaticamente aos suplementos comuns nem à prevenção em todos os adultos saudáveis.",safety:"Podem ocorrer efeitos digestivos. Em doses elevadas, os ómega-3 podem interagir com anticoagulantes ou medicamentos para a tensão arterial. Verifique a quantidade de EPA e DHA, não apenas o peso total do óleo."},
vitamind:{claim:"A vitamina D contribui, entre outras funções, para a absorção do cálcio e a saúde óssea. A suplementação é particularmente relevante quando a ingestão é insuficiente ou existe risco de défice; mais não é necessariamente melhor quando os níveis já são adequados.",limits:"Os efeitos dependem dos níveis iniciais, da dose, da duração e do resultado avaliado. Os benefícios da correção de um défice não provam que doses elevadas previnam todas as doenças.",safety:"Doses excessivas podem causar hipercalcemia e lesão renal. Evite doses elevadas prolongadas sem indicação e aconselhamento profissional; tenha em conta outros produtos que contenham vitamina D."},
ashwagandha:{claim:"Alguns estudos pequenos sugerem possíveis melhorias no stress percebido ou no sono com determinadas preparações, durante períodos limitados. Os resultados não permitem concluir que todos os produtos sejam equivalentes.",limits:"Os extratos, doses, durações e métodos variam; os estudos são frequentemente pequenos e curtos. Os resultados podem não se aplicar a outros produtos comerciais.",safety:"Podem ocorrer efeitos digestivos e sonolência; foram relatados casos raros de lesão hepática. Podem existir interações com medicamentos. Evite durante a gravidez e procure aconselhamento se tiver doença da tiroide, do fígado ou autoimune."}
};
db.forEach(x=>{if(ptTranslations[x.id]){x.claim.pt=ptTranslations[x.id].claim;x.limits.pt=ptTranslations[x.id].limits;x.safety.pt=ptTranslations[x.id].safety;}});

const copy={
 fr:{lang:"Langue",eyebrow:"Des preuves, pas des promesses",headline:"Comprenez ce que la science dit vraiment des suppléments.",intro:"Des fiches transparentes, des limites clairement expliquées et des sources consultables. Pas de classement sponsorisé.",placeholder:"Rechercher un ingrédient (ex. créatine, magnésium)…",search:"Rechercher",results:"Ingrédients",all:"Tous",performance:"Performance",nutrients:"Nutriments",herbs:"Plantes",claim:"Ce que les données suggèrent",timing:"Quand prendre ?",limits:"Limites des preuves",safety:"Sécurité et précautions",sources:"Sources de référence",moderate:"Niveau indicatif : preuves favorables, à vérifier",low:"Niveau indicatif : preuves limitées",not_assessed:"Certitude non évaluée formellement",empty:"Aucun résultat. Essayez un autre terme.",notice:"Information générale uniquement — ne constitue ni un diagnostic ni une recommandation personnalisée. Les fiches de cette première maquette sont des exemples préliminaires et ne doivent pas être utilisées pour prendre une décision médicale. Vérifiez les sources et demandez conseil à un médecin ou à un pharmacien en cas de traitement, de maladie, de grossesse ou de doute.",method:"Méthode : chaque affirmation doit être reliée à des sources consultables, avec population, résultat, limites et date de révision. Les niveaux de certitude affichés ici sont provisoires. Une classification formelle nécessitera une méthode documentée, une évaluation du risque de biais et une relecture.",footer:"Prototype de démonstration • Pas de compte, pas de suivi médical, pas de publicité ni de liens affiliés dans cette version.",review:"Statut : synthèse préliminaire à vérifier",category:"Catégorie"},

function t(k){return copy[document.getElementById("language").value][k]}
function catName(c){return t(c)}
function setLanguage(){let l=document.getElementById("language").value;document.documentElement.lang=l;["langLabel","eyebrow","headline","intro","searchBtn","resultsTitle","safety","method","footer"].forEach(id=>{let key={langLabel:"lang",searchBtn:"search",resultsTitle:"results"}[id]||id; if(copy[l][key])document.getElementById(id).textContent=copy[l][key]});document.getElementById("search").placeholder=copy[l].placeholder;renderFilters();renderResults();renderDetail()}
function renderFilters(){let box=document.getElementById("filters");let cats=["all","performance","nutrients","herbs"];box.innerHTML="";cats.forEach(c=>{let b=document.createElement("button");b.className="chip"+(activeCategory===c?" active":"");b.textContent=t(c);b.onclick=()=>{activeCategory=c;renderFilters();renderResults()};box.appendChild(b)})}
function visible(){let q=document.getElementById("search").value.trim().toLowerCase();return db.filter(x=>(activeCategory==="all"||x.category===activeCategory)&&(!q||[x.names.fr,x.names.en,x.names.pt,...x.aliases].join(" ").toLowerCase().includes(q)))}
function renderResults(){let box=document.getElementById("results");box.innerHTML="";let rows=visible();if(!rows.length){box.innerHTML='<div class="empty">'+t("empty")+'</div>';return}rows.forEach(x=>{let b=document.createElement("button");b.className="result"+(x.id===selectedId?" selected":"");let title=document.createElement("strong");title.textContent=x.names[document.getElementById("language").value];let small=document.createElement("small");small.textContent=catName(x.category);b.append(title,small);b.onclick=()=>{selectedId=x.id;renderResults();renderDetail()};box.appendChild(b)})}
function renderDetail(){let x=db.find(x=>x.id===selectedId)||db[0],l=document.getElementById("language").value;let certainty=x.certainty==="moderate"?t("moderate"):x.certainty==="low"?t("low"):t("not_assessed");let d=document.getElementById("detail");d.innerHTML="";let title=document.createElement("h2");title.textContent=x.names[l];let pill=document.createElement("span");pill.className="pill caution";pill.textContent=t("review");d.append(title,pill);
function section(h,txt){let s=document.createElement("div");s.className="section";let hh=document.createElement("h3");hh.textContent=h;let p=document.createElement("p");p.textContent=txt;s.append(hh,p);d.appendChild(s)}
let c=document.createElement("div");c.className="section";let ch=document.createElement("h3");ch.textContent=t("claim");let cp=document.createElement("p");cp.textContent=x.claim[l];let badge=document.createElement("div");badge.className="pill";badge.textContent=certainty;c.append(ch,cp,badge);d.appendChild(c);
section(t("timing"),x.timing[l]);section(t("limits"),x.limits[l]);section(t("safety"),x.safety[l]);
let s=document.createElement("div");s.className="section sources";let h=document.createElement("h3");h.textContent=t("sources");s.appendChild(h);x.sources.forEach(src=>{let a=document.createElement("a");a.href=src.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=src.label;a.setAttribute("aria-label",src.label+" (opens in new tab)");s.appendChild(a)});d.appendChild(s);
}
document.getElementById("language").addEventListener("change",setLanguage);
document.getElementById("search").addEventListener("input",renderResults);
document.getElementById("searchBtn").addEventListener("click",renderResults);
setLanguage();
</script>
