<script>
const db = [
 {id:"creatine", names:{fr:"Créatine monohydrate",en:"Creatine monohydrate",pt:"Creatina monohidratada"}, aliases:["creatine","créatine","monohydrate","creatina"], timing:{fr:"Le moment exact importe peu : choisissez une heure facile à tenir et prenez-la régulièrement. Avec un repas ou sans repas selon la tolérance; si l’estomac est sensible, prenez-la avec de la nourriture. La régularité est mieux étayée que l’idée d’une fenêtre obligatoire après l’entraînement.",en:"Exact timing matters little: choose an easy time and take it consistently. With or without food according to tolerance; if your stomach is sensitive, take it with a meal. Consistency is better supported than a mandatory post-workout window.",pt:"A hora exata importa pouco: escolha um horário fácil de manter e tome-a regularmente. Pode ser com ou sem comida, conforme a tolerância; se causar desconforto gástrico, tome com uma refeição. A regularidade tem mais fundamento do que uma janela obrigatória após o treino."}, category:"performance", status:"review", certainty:"moderate", claim:{fr:"La créatine monohydrate est l’un des suppléments les mieux étudiés pour améliorer la capacité à répéter des efforts intenses et soutenir les gains de force et de masse maigre lorsqu’elle est associée à l’entraînement.",en:"Creatine monohydrate is one of the best-studied supplements for improving repeated high-intensity exercise capacity and supporting strength and lean-mass gains when combined with training."}, limits:{fr:"L’ampleur de l’effet dépend du type d’exercice, du programme et de la personne. Une hausse initiale du poids peut notamment refléter davantage d’eau dans les muscles. La source principale est une prise de position scientifique, pas une revue systématique indépendante récente.",en:"Effect size depends on exercise type, training programme and individual. An early increase in body weight can partly reflect increased water stored in muscle. The key source is a scientific position stand, not a recent independent systematic review."}, safety:{fr:"Des troubles digestifs sont possibles. En cas de maladie rénale, de grossesse, de traitement ou de situation médicale particulière, demander conseil à un professionnel de santé. La sécurité chez des personnes en bonne santé ne doit pas être extrapolée à tous les contextes.",en:"Digestive symptoms can occur. People with kidney disease, those who are pregnant, or anyone taking medicines or with a relevant medical condition should seek professional advice. Safety in healthy people should not be extrapolated to every situation."}, sources:[{label:"ISSN position stand — Creatine supplementation (2017; full text)",url:"https://pmc.ncbi.nlm.nih.gov/articles/PMC5469049/"},{label:"NIH ODS — Dietary Supplements for Exercise and Athletic Performance",url:"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"}]},
 {id:"magnesium", names:{fr:"Magnésium",en:"Magnesium",pt:"Magnésio"}, aliases:["magnesium","magnésium","glycinate","citrate","magnésio"], timing:{fr:"Il n’existe pas d’heure universelle optimale. Prenez-le à un moment régulier; avec un repas peut améliorer la tolérance digestive. Le soir n’est pas démontré comme supérieur pour tout le monde. Respectez les consignes du produit et l’espacement avec certains médicaments.",en:"There is no universally optimal time. Take it at a consistent time; taking it with food may improve digestive tolerance. Evening use has not been shown to be better for everyone. Follow product directions and separate it from certain medicines when advised.",pt:"Não existe uma hora ideal para toda a gente. Tome-o num horário regular; fazê-lo com uma refeição pode melhorar a tolerância digestiva. Não está demonstrado que à noite seja melhor para todos. Siga as instruções do produto e respeite o intervalo em relação a certos medicamentos."}, category:"nutrients", status:"review", certainty:"not_assessed", claim:{fr:"Le magnésium est essentiel au fonctionnement normal de l’organisme. Un supplément peut être utile lorsque les apports sont insuffisants ou dans certaines indications, mais cela ne prouve pas qu’il améliore systématiquement le sommeil, l’énergie ou les performances chez toute personne.",en:"Magnesium is essential for normal body function. Supplementation may help when intake is inadequate or for specific indications, but this does not show that it routinely improves sleep, energy or performance in everyone."}, limits:{fr:"Les effets dépendent de l’état nutritionnel, de la dose, de la forme et du résultat étudié. Les taux sanguins ne reflètent pas parfaitement les réserves totales de magnésium.",en:"Effects depend on nutritional status, dose, formulation and outcome studied. Blood levels do not perfectly reflect total body magnesium stores."}, safety:{fr:"Les suppléments peuvent provoquer diarrhée et crampes abdominales. Le risque d’accumulation augmente en cas d’insuffisance rénale. Le magnésium peut interagir avec certains antibiotiques et bisphosphonates; vérifier les espacements avec un pharmacien.",en:"Supplements can cause diarrhoea and abdominal cramps. Accumulation risk increases with kidney impairment. Magnesium can interact with some antibiotics and bisphosphonates; ask a pharmacist about dose spacing."}, sources:[{label:"NIH ODS — Magnesium: Health Professional Fact Sheet",url:"https://ods.od.nih.gov/factsheets/Magnesium-HealthProfessional/"}]},
 {id:"glutamine", names:{fr:"Glutamine",en:"Glutamine",pt:"Glutamina"}, aliases:["glutamine","l-glutamine","l glutamine","glutamina"], timing:{fr:"Pour les adultes en bonne santé, aucun moment précis n’a démontré un bénéfice sportif fiable. Si vous l’utilisez, suivez l’étiquette et choisissez un horaire toléré; la prise avant ou après l’entraînement n’a pas de supériorité clairement établie.",en:"For healthy adults, no specific timing has shown a reliable sports benefit. If you use it, follow the label and choose a time you tolerate; taking it before or after exercise has no clearly established advantage.",pt:"Em adultos saudáveis, não há um horário específico que tenha demonstrado um benefício desportivo fiável. Se a utilizar, siga o rótulo e escolha um horário bem tolerado; não está claramente demonstrado que tomar antes ou depois do treino seja superior."}, category:"performance", status:"review", certainty:"low", claim:{fr:"La glutamine est un acide aminé abondant dans le corps. Chez les adultes en bonne santé qui s’entraînent, les preuves ne montrent pas de manière convaincante qu’un supplément améliore systématiquement la prise de muscle ou la performance sportive.",en:"Glutamine is an abundant amino acid in the body. In healthy exercising adults, evidence does not convincingly show that supplementation consistently improves muscle gain or athletic performance."}, limits:{fr:"Les résultats varient selon les populations et les contextes cliniques. Un rôle biologique important de la glutamine ne signifie pas qu’une supplémentation apporte un bénéfice supplémentaire. Cette synthèse est indicative et ne constitue pas une revue systématique.",en:"Results vary across populations and clinical settings. An important biological role for glutamine does not mean supplementation provides extra benefit. This is an indicative summary, not a systematic review."}, safety:{fr:"La sécurité et l’utilité dépendent du contexte médical, de la dose et des autres traitements. En cas de maladie chronique, grossesse ou traitement médicamenteux, demander un avis professionnel avant usage.",en:"Safety and usefulness depend on medical context, dose and other treatments. People with chronic illness, those who are pregnant, or those taking medicines should seek professional advice before use."}, sources:[{label:"NIH PubMed — Search for clinical reviews on glutamine and exercise",url:"https://pubmed.ncbi.nlm.nih.gov/?term=glutamine+supplementation+exercise+systematic+review"}]},
 {id:"omega3", names:{fr:"Oméga-3 (EPA/DHA/ALA)",en:"Omega-3 (EPA/DHA/ALA)",pt:"Ómega-3 (EPA/DHA/ALA)"}, aliases:["omega 3","oméga-3","omega-3","epa","dha","ala","huile de poisson","algae","ómega","omega","oleo de peixe","óleo de peixe"], timing:{fr:"Prenez-le avec un repas, idéalement contenant un peu de matière grasse, pour faciliter la tolérance et l’absorption. Aucun horaire universel (matin ou soir) n’est supérieur; la dose et l’indication comptent davantage.",en:"Take it with a meal, ideally containing some fat, to support tolerance and absorption. No universal time (morning or evening) is superior; dose and indication matter more.",pt:"Tome-o com uma refeição, idealmente com alguma gordura, para favorecer a tolerância e a absorção. Não há prova de que manhã ou noite seja universalmente melhor; a dose e a indicação são mais importantes."}, category:"nutrients", status:"review", certainty:"not_assessed", claim:{fr:"Les oméga-3 ne sont pas tous identiques : l’ALA provient notamment de graines et d’huiles végétales, tandis que l’EPA et le DHA se trouvent surtout dans les poissons gras et certaines huiles d’algues. Les effets d’un supplément dépendent de l’indication et de la formulation.",en:"Omega-3s are not interchangeable: ALA comes from sources such as seeds and plant oils, while EPA and DHA are found mainly in oily fish and some algal oils. Supplement effects depend on the indication and formulation."}, limits:{fr:"Les résultats observés pour un médicament à base d’oméga-3 ou une population à risque ne s’appliquent pas automatiquement aux compléments courants ni à la prévention chez tout adulte en bonne santé.",en:"Findings for prescription omega-3 medicines or high-risk populations do not automatically apply to ordinary supplements or prevention in every healthy adult."}, safety:{fr:"Des troubles digestifs sont possibles. À fortes doses, les oméga-3 peuvent interagir avec les anticoagulants ou les traitements de la tension. Vérifier la quantité d’EPA et de DHA, pas seulement le poids total d’huile.",en:"Digestive symptoms can occur. At high doses, omega-3s may interact with anticoagulants or blood-pressure medicines. Check the EPA and DHA amounts, not only the total oil weight."}, sources:[{label:"NIH ODS — Omega-3 Fatty Acids: Health Professional Fact Sheet",url:"https://ods.od.nih.gov/factsheets/Omega3FattyAcids-HealthProfessional/"}]},
 {id:"vitamind", names:{fr:"Vitamine D",en:"Vitamin D",pt:"Vitamina D"}, aliases:["vitamine d","vitamin d","d3","cholecalciferol","cholécalciférol","vitamina d"], timing:{fr:"Prenez-la avec un repas contenant un peu de graisse, car la vitamine D est liposoluble. Il n’existe pas d’heure de la journée universellement optimale. La dose doit tenir compte des apports, du risque de déficit et, si nécessaire, d’un avis professionnel.",en:"Take it with a meal containing some fat because vitamin D is fat-soluble. There is no universally optimal time of day. Dose should reflect intake, deficiency risk and, when needed, professional advice.",pt:"Tome-a com uma refeição que contenha alguma gordura, porque a vitamina D é lipossolúvel. Não existe uma hora do dia universalmente ideal. A dose deve considerar a alimentação, o risco de défice e, quando necessário, aconselhamento profissional."}, category:"nutrients", status:"review", certainty:"not_assessed", claim:{fr:"La vitamine D contribue notamment à l’absorption du calcium et à la santé osseuse. Une supplémentation est particulièrement pertinente en cas d’apports insuffisants ou de risque de déficit; davantage n’est pas forcément mieux lorsque le statut est déjà adéquat.",en:"Vitamin D helps, among other roles, with calcium absorption and bone health. Supplementation is particularly relevant when intake is inadequate or deficiency risk is present; more is not necessarily better when status is already adequate."}, limits:{fr:"Les effets dépendent du statut initial, de la dose, de la durée et du résultat évalué. Les bénéfices démontrés pour corriger un déficit ne prouvent pas que de fortes doses préviennent toutes les maladies.",en:"Effects depend on baseline status, dose, duration and the outcome assessed. Benefits for correcting deficiency do not prove that high doses prevent every disease."}, safety:{fr:"Des doses excessives peuvent entraîner une hypercalcémie et des atteintes rénales. Éviter les fortes doses prolongées sans indication et avis professionnel; tenir compte des autres produits contenant de la vitamine D.",en:"Excessive doses can cause hypercalcaemia and kidney injury. Avoid prolonged high doses without an indication and professional advice; account for other products containing vitamin D."}, sources:[{label:"NIH ODS — Vitamin D: Health Professional Fact Sheet",url:"https://ods.od.nih.gov/factsheets/VitaminD-HealthProfessional/"}]},
 {id:"ashwagandha", names:{fr:"Ashwagandha",en:"Ashwagandha",pt:"Ashwagandha"}, aliases:["ashwagandha","withania","withania somnifera"], timing:{fr:"Les études ne définissent pas d’heure optimale. Selon le produit et la tolérance, certaines personnes la prennent avec un repas; si elle provoque de la somnolence, évitez les activités nécessitant de la vigilance. La sécurité et les interactions priment sur l’horaire.",en:"Studies do not establish an optimal time. Depending on the product and tolerance, some take it with a meal; if it causes drowsiness, avoid activities requiring alertness. Safety and interactions matter more than timing.",pt:"Os estudos não estabelecem uma hora ideal. Dependendo do produto e da tolerância, algumas pessoas tomam-na com uma refeição; se causar sonolência, evite atividades que exijam atenção. A segurança e as interações são mais importantes do que o horário."}, category:"herbs", status:"review", certainty:"low", claim:{fr:"Certaines petites études suggèrent une possible amélioration du stress perçu ou du sommeil avec certaines préparations, sur des périodes limitées. Les résultats ne permettent pas de conclure que tous les produits se valent.",en:"Some small studies suggest possible improvements in perceived stress or sleep with certain preparations over limited periods. Results do not establish that all products are equivalent."}, limits:{fr:"Les extraits, doses, durées et méthodes varient; les études sont souvent petites et de courte durée. Les résultats ne s’appliquent pas nécessairement aux autres produits commerciaux.",en:"Extracts, doses, durations and methods vary; studies are often small and short-term. Results may not apply to other commercial products."}, safety:{fr:"Des effets indésirables digestifs et une somnolence sont possibles; de rares atteintes hépatiques ont été signalées. Des interactions sont possibles, notamment avec certains médicaments. Éviter pendant la grossesse et demander conseil en cas de maladie thyroïdienne, hépatique ou auto-immune.",en:"Digestive effects and drowsiness are possible; rare liver injuries have been reported. Interactions may occur with some medicines. Avoid during pregnancy and seek advice with thyroid, liver or autoimmune conditions."}, sources:[{label:"NCCIH — Ashwagandha: Usefulness and Safety",url:"https://www.nccih.nih.gov/health/ashwagandha"}]}
,
 {id:"caffeine", names:{fr:"Caféine",en:"Caffeine",pt:"Cafeína"}, aliases:["caffeine","caféine","cafeina","cafeína","coffee","café","café expresso"], category:"performance", status:"review", certainty:"moderate", timing:{fr:"Pour la performance, les études utilisent souvent une prise environ 30 à 60 minutes avant l’effort, mais l’effet dépend de la dose, de la sensibilité et de la forme. Évitez-la tard dans la journée : même une prise plusieurs heures avant le coucher peut perturber le sommeil.",en:"For performance, studies often use caffeine about 30–60 minutes before exercise, but effects depend on dose, sensitivity and formulation. Avoid late-day use: even caffeine taken several hours before bedtime may disrupt sleep.",pt:"Para o desempenho, os estudos usam frequentemente cafeína cerca de 30–60 minutos antes do exercício, mas o efeito depende da dose, da sensibilidade e da forma. Evite-a ao fim do dia: mesmo tomada várias horas antes de dormir pode prejudicar o sono."}, claim:{fr:"La caféine peut améliorer modestement la vigilance et certaines performances physiques, notamment l’endurance, chez certaines personnes. Elle n’est pas nécessaire à tout le monde et n’est pas un substitut au sommeil.",en:"Caffeine can modestly improve alertness and some forms of physical performance, particularly endurance, in some people. It is not necessary for everyone and is not a substitute for sleep.",pt:"A cafeína pode melhorar moderadamente a atenção e alguns tipos de desempenho físico, sobretudo a resistência, em algumas pessoas. Não é necessária para todos e não substitui o sono."}, limits:{fr:"Les effets varient avec l’habitude de consommation, la génétique, la dose et l’activité. Une dose plus élevée n’est pas forcément plus efficace et peut augmenter les effets indésirables. Les réponses sur le sport ne garantissent pas une melhoria pour chaque personne.",en:"Effects vary with habitual intake, genetics, dose and activity. A higher dose is not necessarily more effective and can increase adverse effects. Sports findings do not guarantee improvement for every individual.",pt:"Os efeitos variam com o consumo habitual, a genética, a dose e a atividade. Uma dose maior não é necessariamente mais eficaz e pode aumentar os efeitos adversos. Os resultados desportivos não garantem melhorias em todas as pessoas."}, safety:{fr:"Peut provoquer nervosité, palpitations, anxiété ou troubles du sommeil. Comptez aussi le café, le thé, les boissons énergisantes et les médicaments. En cas de grossesse, de maladie cardiovasculaire, d’anxiété importante ou de traitement, demandez conseil à un professionnel.",en:"May cause jitters, palpitations, anxiety or sleep disruption. Count caffeine from coffee, tea, energy drinks and medicines too. Seek professional advice during pregnancy, with cardiovascular disease, significant anxiety or relevant medication.",pt:"Pode causar nervosismo, palpitações, ansiedade ou alterações do sono. Conte também a cafeína do café, chá, bebidas energéticas e medicamentos. Peça aconselhamento durante a gravidez, em caso de doença cardiovascular, ansiedade significativa ou medicação relevante."}, sources:[{label:"NIH ODS — Exercise and Athletic Performance",url:"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"},{label:"EFSA — Scientific Opinion on the Safety of Caffeine",url:"https://www.efsa.europa.eu/en/efsajournal/pub/4102"}]},
 {id:"whey", names:{fr:"Protéine whey",en:"Whey protein",pt:"Proteína whey",}, aliases:["whey","whey protein","protéine whey","proteina whey","proteína whey","lactosérum","whey isolate","isolat"], category:"performance", status:"review", certainty:"moderate", timing:{fr:"Le total quotidien de protéines et leur répartition dans la journée comptent davantage qu’une minute précise. La whey peut être prise après l’entraînement par commodité, ou à un autre moment pour compléter un repas; elle peut être prise avec de l’eau ou un aliment selon la tolérance.",en:"Total daily protein and its distribution across the day matter more than an exact minute. Whey can be taken after exercise for convenience or at another time to supplement a meal; use water or food according to tolerance.",pt:"A quantidade total diária de proteína e a sua distribuição ao longo do dia são mais importantes do que um minuto exato. A whey pode ser tomada após o treino por conveniência ou noutra altura para complementar uma refeição; pode ser misturada com água ou alimentos conforme a tolerância."}, claim:{fr:"La whey est une protéine complète riche en acides aminés essentiels. Elle peut aider à atteindre les besoins protéiques et soutenir l’adaptation à l’entraînement de résistance, surtout lorsque l’apport alimentaire total est insuffisant.",en:"Whey is a complete protein rich in essential amino acids. It can help meet protein needs and support adaptation to resistance training, particularly when total dietary intake is insufficient.",pt:"A whey é uma proteína completa, rica em aminoácidos essenciais. Pode ajudar a atingir as necessidades proteicas e apoiar a adaptação ao treino de força, sobretudo quando a ingestão alimentar total é insuficiente."}, limits:{fr:"Elle n’est pas nécessaire si l’alimentation apporte déjà suffisamment de protéines. Les résultats dépendent de l’apport total, de l’entraînement et de l’énergie consommée. Les poudres diffèrent par leur teneur en protéines, lactose, édulcorants et contaminants; ce n’est pas un produit amaigrissant en soi.",en:"It is not necessary if the diet already provides enough protein. Outcomes depend on total intake, training and energy intake. Powders differ in protein, lactose, sweeteners and contaminant content; whey is not inherently a weight-loss product.",pt:"Não é necessária se a alimentação já fornecer proteína suficiente. Os resultados dependem da ingestão total, do treino e da energia consumida. Os pós diferem no teor de proteína, lactose, adoçantes e contaminantes; a whey não é, por si só, um produto para emagrecer."}, safety:{fr:"Peut provoquer des symptômes digestifs, notamment en cas d’intolérance au lactose (souvent moins avec un isolat, mais pas toujours zéro). Évitez en cas d’allergie aux protéines du lait. En cas de maladie rénale ou de régime médical, définissez l’apport avec un professionnel.",en:"May cause digestive symptoms, especially with lactose intolerance (often less with an isolate, but not always zero). Avoid with milk-protein allergy. With kidney disease or a medically prescribed diet, discuss protein targets with a professional.",pt:"Pode causar sintomas digestivos, sobretudo em caso de intolerância à lactose (frequentemente menos com um isolado, mas nem sempre zero). Evite em caso de alergia às proteínas do leite. Em caso de doença renal ou dieta clínica, defina a ingestão com um profissional."}, sources:[{label:"ISSN Position Stand — Protein and exercise",url:"https://jissn.biomedcentral.com/articles/10.1186/s12970-017-0177-8"},{label:"NIH ODS — Exercise and Athletic Performance",url:"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"}]},
 {id:"b12", names:{fr:"Vitamine B12",en:"Vitamin B12",pt:"Vitamina B12"}, aliases:["vitamine b12","vitamin b12","b12","cobalamine","cobalamin","vitamina b12"], category:"nutrients", status:"review", certainty:"not_assessed", timing:{fr:"Aucune heure de la journée n’a montré une supériorité générale. Suivez la dose et la fréquence adaptées à la formulation et à l’indication; avec ou sans repas selon les instructions du produit. En cas de déficit confirmé, la régularité et le schéma de traitement sont prioritaires.",en:"No time of day has shown general superiority. Follow the dose and frequency appropriate to the formulation and indication; take with or without food according to product directions. For confirmed deficiency, consistency and the treatment regimen matter most.",pt:"Não foi demonstrado que uma hora do dia seja geralmente superior. Siga a dose e a frequência adequadas à formulação e à indicação; tome com ou sem alimentos conforme as instruções. Em caso de défice confirmado, a regularidade e o esquema de tratamento são prioritários."}, claim:{fr:"La vitamine B12 est nécessaire à la formation des globules rouges et au fonctionnement neurologique. La supplémentation est importante pour prévenir ou corriger un déficit, notamment chez les personnes qui ne consomment pas d’aliments d’origine animale ou qui ont des problèmes d’absorption.",en:"Vitamin B12 is needed for red blood cell formation and neurological function. Supplementation is important to prevent or correct deficiency, including in people who do not consume animal-derived foods or who have absorption problems.",pt:"A vitamina B12 é necessária para a formação de glóbulos vermelhos e para a função neurológica. A suplementação é importante para prevenir ou corrigir défice, nomeadamente em pessoas que não consomem alimentos de origem animal ou que têm problemas de absorção."}, limits:{fr:"Un bénéfice clair pour corriger un déficit ne signifie pas qu’une supplémentation améliore l’énergie ou la cognition chez les personnes qui ont déjà un statut adéquat. Les causes d’un déficit peuvent nécessiter une évaluation médicale et parfois un traitement différent.",en:"Clear benefits for correcting deficiency do not mean supplementation boosts energy or cognition in people whose status is already adequate. Causes of deficiency may need medical assessment and sometimes a different treatment approach.",pt:"O benefício claro na correção de um défice não significa que a suplementação aumente a energia ou a cognição em pessoas com níveis adequados. As causas do défice podem exigir avaliação médica e, por vezes, outro tratamento."}, safety:{fr:"Généralement bien tolérée, mais un déficit suspecté — notamment avec fatigue persistante, engourdissements ou fourmillements — mérite une évaluation. Certains médicaments et troubles digestifs peuvent réduire l’absorption. Ne retardez pas un avis médical en cas de symptômes neurologiques.",en:"Generally well tolerated, but suspected deficiency—especially with persistent fatigue, numbness or tingling—deserves assessment. Some medicines and digestive disorders can reduce absorption. Do not delay medical advice for neurological symptoms.",pt:"É geralmente bem tolerada, mas a suspeita de défice — sobretudo com fadiga persistente, dormência ou formigueiro — merece avaliação. Alguns medicamentos e problemas digestivos podem reduzir a absorção. Não adie aconselhamento médico perante sintomas neurológicos."}, sources:[{label:"NIH ODS — Vitamin B12: Health Professional Fact Sheet",url:"https://ods.od.nih.gov/factsheets/VitaminB12-HealthProfessional/"}]},
 {id:"iron", names:{fr:"Fer",en:"Iron",pt:"Ferro"}, aliases:["fer","iron","ferrous","ferritine","ferritin","ferro"], category:"nutrients", status:"review", certainty:"not_assessed", timing:{fr:"Le fer est souvent mieux absorbé à jeun, mais peut irriter l’estomac; si nécessaire, prenez-le avec un peu de nourriture selon les conseils reçus. Le calcium, le thé et le café peuvent réduire l’absorption autour de la prise. Respectez l’espacement indiqué par le professionnel ou le pharmacien.",en:"Iron is often better absorbed on an empty stomach, but may upset the stomach; if needed, take it with a small amount of food as advised. Calcium, tea and coffee can reduce absorption around the dose. Follow spacing instructions from a clinician or pharmacist.",pt:"O ferro é frequentemente melhor absorvido em jejum, mas pode irritar o estômago; se necessário, tome-o com um pouco de comida conforme aconselhamento. O cálcio, o chá e o café podem reduzir a absorção perto da toma. Respeite os intervalos indicados pelo profissional ou farmacêutico."}, claim:{fr:"Le fer est nécessaire au transport de l’oxygène. Une supplémentation peut traiter une carence en fer confirmée et certaines situations à risque, mais elle ne doit pas être prise systématiquement sans indication.",en:"Iron is required for oxygen transport. Supplementation can treat confirmed iron deficiency and may be indicated in some at-risk situations, but it should not be taken routinely without a reason.",pt:"O ferro é necessário para o transporte de oxigénio. A suplementação pode tratar uma carência de ferro confirmada e ser indicada em algumas situações de risco, mas não deve ser tomada sistematicamente sem indicação."}, limits:{fr:"La fatigue a de nombreuses causes et ne prouve pas un déficit en fer. Les analyses et la recherche de la cause peuvent être nécessaires. Un supplément ne traite pas forcément la raison d’une perte de fer ou d’une mauvaise absorption.",en:"Fatigue has many causes and does not prove iron deficiency. Tests and investigation of the cause may be needed. A supplement does not necessarily treat the reason for iron loss or poor absorption.",pt:"A fadiga tem muitas causas e não prova falta de ferro. Podem ser necessários exames e investigação da causa. Um suplemento não trata necessariamente a razão da perda de ferro ou da má absorção."}, safety:{fr:"Un excès de fer peut être toxique; gardez les produits hors de portée des enfants. Le fer interagit avec plusieurs médicaments et minéraux. Ne commencez pas une supplémentation à forte dose sans bilan ou avis médical, particulièrement en cas de maladie chronique.",en:"Excess iron can be toxic; keep products out of children's reach. Iron interacts with several medicines and minerals. Do not start high-dose supplementation without testing or medical advice, especially with chronic illness.",pt:"O excesso de ferro pode ser tóxico; mantenha os produtos fora do alcance das crianças. O ferro interage com vários medicamentos e minerais. Não comece doses elevadas sem análises ou aconselhamento médico, sobretudo em caso de doença crónica."}, sources:[{label:"NIH ODS — Iron: Health Professional Fact Sheet",url:"https://ods.od.nih.gov/factsheets/Iron-HealthProfessional/"}]} ,
 {id:"zinc",names:{fr:"Zinc",en:"Zinc",pt:"Zinco"},aliases:["zinc","zinco"],category:"nutrients",status:"review",certainty:"not_assessed",timing:{fr:"Peut être pris avec un repas si le zinc provoque des nausées. Évitez les fortes doses prolongées sans indication et vérifiez les interactions avec certains antibiotiques.",en:"May be taken with food if zinc causes nausea. Avoid prolonged high doses without an indication and check interactions with some antibiotics.",pt:"Pode ser tomado com uma refeição se causar náuseas. Evite doses elevadas prolongadas sem indicação e confirme possíveis interações com alguns antibióticos."},claim:{fr:"Le zinc est essentiel à de nombreuses fonctions. Une supplémentation peut corriger un apport insuffisant ou une carence, mais ne procure pas nécessairement de bénéfice supplémentaire aux personnes qui ont déjà un statut adéquat.",en:"Zinc is essential for many body functions. Supplementation can correct inadequate intake or deficiency, but does not necessarily provide extra benefit to people with adequate status.",pt:"O zinco é essencial a várias funções do organismo. A suplementação pode corrigir uma ingestão insuficiente ou um défice, mas não traz necessariamente benefícios adicionais a quem já tem níveis adequados."},limits:{fr:"Les bénéfices dépendent du statut initial et de l’indication. Les preuves concernant le rhume varient selon la formulation et le protocole.",en:"Benefits depend on baseline status and indication. Evidence about the common cold varies by formulation and regimen.",pt:"Os benefícios dependem do estado inicial e da indicação. A evidência sobre constipações varia consoante a formulação e o esquema de utilização."},safety:{fr:"Des doses élevées prolongées peuvent provoquer une carence en cuivre et d’autres effets indésirables. Peut interagir avec des antibiotiques et la pénicillamine.",en:"Prolonged high doses can cause copper deficiency and other adverse effects. Zinc can interact with antibiotics and penicillamine.",pt:"Doses elevadas durante muito tempo podem causar défice de cobre e outros efeitos adversos. Pode interagir com antibióticos e penicilamina."},sources:[{label:"NIH ODS — Zinc Fact Sheet",url:"https://ods.od.nih.gov/factsheets/Zinc-HealthProfessional/"}]},
 {id:"melatonin",names:{fr:"Mélatonine",en:"Melatonin",pt:"Melatonina"},aliases:["melatonin","mélatonine","melatonina","sleep"],category:"herbs",status:"review",certainty:"low",timing:{fr:"Le moment dépend du problème de sommeil et de la formulation; le timing peut être important pour le rythme circadien. Suivez les instructions d’un professionnel et évitez de conduire si somnolent.",en:"Timing depends on the sleep problem and formulation; timing can matter for circadian rhythm. Follow professional advice and do not drive if drowsy.",pt:"O horário depende do problema de sono e da formulação; pode ser importante para o ritmo circadiano. Siga aconselhamento profissional e não conduza se sentir sonolência."},claim:{fr:"La mélatonine peut aider dans certaines situations, notamment certains problèmes de rythme circadien ou de décalage horaire. Elle n’est pas une solução universal para insónia crónica.",en:"Melatonin may help in some situations, including certain circadian-rhythm problems or jet lag. It is not a universal solution for chronic insomnia.",pt:"A melatonina pode ajudar em algumas situações, incluindo certos problemas do ritmo circadiano ou jet lag. Não é uma solução universal para a insónia crónica."},limits:{fr:"Les effets dépendent de la cause du trouble, de la dose, de la formulation et de l’horaire. Les données sur l’utilisation prolongée sont moins certaines.",en:"Effects depend on the cause of the sleep problem, dose, formulation and timing. Evidence on long-term use is less certain.",pt:"Os efeitos dependem da causa do problema de sono, da dose, da formulação e do horário. A evidência sobre utilização prolongada é menos segura."},safety:{fr:"Peut provoquer somnolence et interagir avec des médicaments. Demandez conseil en cas de grossesse, d’épilepsie, de traitement anticoagulant ou d’utilisation chez un enfant.",en:"May cause drowsiness and interact with medicines. Seek advice during pregnancy, with epilepsy, anticoagulant treatment or use in children.",pt:"Pode causar sonolência e interagir com medicamentos. Peça aconselhamento em caso de gravidez, epilepsia, anticoagulantes ou utilização em crianças."},sources:[{label:"NCCIH — Melatonin: What You Need To Know",url:"https://www.nccih.nih.gov/health/melatonin-what-you-need-to-know"}]},
 {id:"collagen",names:{fr:"Collagène",en:"Collagen",pt:"Colagénio"},aliases:["collagen","collagène","colageno","colagénio","peptides de collagène"],category:"performance",status:"review",certainty:"low",timing:{fr:"Aucune heure optimale n’est établie. Les études utilisent des protocoles variés; la régularité et le contexte d’utilisation comptent davantage qu’une fenêtre horaire prétendument parfaite.",en:"No optimal time is established. Studies use varied protocols; consistency and context matter more than a supposedly perfect timing window.",pt:"Não existe um horário ideal estabelecido. Os estudos usam protocolos diferentes; a regularidade e o contexto importam mais do que uma suposta janela perfeita."},claim:{fr:"Certaines études suggèrent des bénéfices possibles pour certains symptômes articulaires ou paramètres de peau, mais la qualité et l’indépendance des preuves varient.",en:"Some studies suggest possible benefits for certain joint symptoms or skin measures, but evidence quality and independence vary.",pt:"Alguns estudos sugerem possíveis benefícios para certos sintomas articulares ou parâmetros da pele, mas a qualidade e independência da evidência variam."},limits:{fr:"Les résultats ne sont pas uniformes et les produits étudiés diffèrent. Le collagène n’est pas une protéine complète équivalente à une source protéique de haute qualité pour tous les objectifs.",en:"Results are inconsistent and studied products differ. Collagen is not a complete protein equivalent to a high-quality protein source for every goal.",pt:"Os resultados são inconsistentes e os produtos estudados diferem. O colagénio não é uma proteína completa equivalente a uma fonte proteica de elevada qualidade para todos os objetivos."},safety:{fr:"Vérifiez l’origine (poisson, bovin, porc), les allergènes et la qualité du produit. Demandez conseil en cas d’allergie ou de maladie pertinente.",en:"Check source (fish, bovine, porcine), allergens and product quality. Seek advice if you have allergies or relevant medical conditions.",pt:"Verifique a origem (peixe, bovino, suíno), os alergénios e a qualidade do produto. Peça aconselhamento se tiver alergias ou condições clínicas relevantes."},sources:[{label:"Harvard Health — Do collagen supplements work?",url:"https://www.health.harvard.edu/blog/do-collagen-supplements-work-202205132748"}]},
 {id:"multivitamin",names:{fr:"Multivitamines",en:"Multivitamin",pt:"Multivitamínico"},aliases:["multivitamin","multivitamines","multivitamínico","multivitaminico","multi vitamin"],category:"nutrients",status:"review",certainty:"not_assessed",timing:{fr:"Suivez l’étiquette; une prise avec un repas peut améliorer la tolérance et l’absorption de certaines vitamines liposolubles. L’heure précise est généralement secondaire.",en:"Follow the label; taking it with a meal may improve tolerance and absorption of some fat-soluble vitamins. Exact timing is usually secondary.",pt:"Siga o rótulo; tomar com uma refeição pode melhorar a tolerância e a absorção de algumas vitaminas lipossolúveis. A hora exata é geralmente secundária."},claim:{fr:"Un multivitaminé peut aider à couvrir certains apports insuffisants, mais les effets sur la prévention des maladies ou la longévité ne sont pas établis de façon uniforme pour la population générale.",en:"A multivitamin may help cover some nutrient gaps, but effects on disease prevention or longevity are not consistently established for the general population.",pt:"Um multivitamínico pode ajudar a cobrir algumas insuficiências nutricionais, mas os efeitos na prevenção de doenças ou longevidade não estão demonstrados de forma consistente na população geral."},limits:{fr:"Les formulations varient fortement. Les résultats d’un essai sur un produit ou une population ne s’appliquent pas automatiquement à tous les multivitaminés.",en:"Formulations vary substantially. Results from one trial or population do not automatically apply to all multivitamins.",pt:"As formulações variam muito. Os resultados de um ensaio ou população não se aplicam automaticamente a todos os multivitamínicos."},safety:{fr:"Évitez de cumuler plusieurs produits contenant les mêmes nutriments, notamment les vitamines A et D, le fer ou le zinc. Certaines formulations interagissent avec des médicaments.",en:"Avoid stacking products with the same nutrients, especially vitamins A and D, iron or zinc. Some formulations interact with medicines.",pt:"Evite combinar vários produtos com os mesmos nutrientes, sobretudo vitaminas A e D, ferro ou zinco. Algumas formulações interagem com medicamentos."},sources:[{label:"NIH ODS — Dietary Supplements: What You Need to Know",url:"https://ods.od.nih.gov/factsheets/WYNTK-Consumer/"}]},
 {id:"betaalanine",names:{fr:"Bêta-alanine",en:"Beta-alanine",pt:"Beta-alanina"},aliases:["beta alanine","beta-alanine","bêta-alanine","beta alanina","beta-alanina"],category:"performance",status:"review",certainty:"moderate",timing:{fr:"Les protocoles étudiés reposent généralement sur une prise quotidienne pendant plusieurs semaines, pas seulement juste avant l’entraînement. Des doses fractionnées peuvent limiter les picotements.",en:"Studied protocols generally use daily intake over several weeks, not just immediately before exercise. Divided doses may reduce tingling.",pt:"Os protocolos estudados usam geralmente toma diária durante várias semanas, não apenas imediatamente antes do treino. Dividir a dose pode reduzir o formigueiro."},claim:{fr:"La bêta-alanine peut améliorer modestement la capacité lors d’efforts intenses durant environ 1 à 4 minutes, dans certains contextes. Elle n’est pas un stimulant immédiat.",en:"Beta-alanine may modestly improve capacity during intense efforts lasting roughly 1–4 minutes in some contexts. It is not an immediate stimulant.",pt:"A beta-alanina pode melhorar modestamente a capacidade em esforços intensos com duração aproximada de 1–4 minutos, em alguns contextos. Não é um estimulante imediato."},limits:{fr:"Le bénéfice dépend du type d’effort et du protocole. Les preuves sont moins convaincantes pour la force maximale isolée ou les efforts très courts.",en:"Benefit depends on exercise type and protocol. Evidence is less convincing for isolated maximal strength or very short efforts.",pt:"O benefício depende do tipo de esforço e do protocolo. A evidência é menos convincente para força máxima isolada ou esforços muito curtos."},safety:{fr:"Le picotement cutané (paresthésie) est fréquent et généralement transitoire; des doses fractionnées peuvent aider. Choisissez des produits testés pour leur qualité.",en:"Skin tingling (paraesthesia) is common and usually temporary; divided doses may help. Choose products tested for quality.",pt:"O formigueiro na pele (parestesia) é frequente e geralmente temporário; dividir a dose pode ajudar. Escolha produtos com controlo de qualidade."},sources:[{label:"NIH ODS — Exercise and Athletic Performance",url:"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"}]},
 {id:"probiotics",names:{fr:"Probiotiques",en:"Probiotics",pt:"Probióticos"},aliases:["probiotic","probiotics","probiotique","probiotiques","probiótico","probióticos"],category:"nutrients",status:"review",certainty:"not_assessed",timing:{fr:"Le moment dépend de la souche et du produit; suivez les instructions du fabricant ou du professionnel. Il n’existe pas une règle horaire valable pour tous les probiotiques.",en:"Timing depends on strain and product; follow manufacturer or clinician instructions. There is no single timing rule for all probiotics.",pt:"O horário depende da estirpe e do produto; siga as instruções do fabricante ou profissional. Não existe uma regra horária única para todos os probióticos."},claim:{fr:"Les effets des probiotiques sont spécifiques à la souche, à la dose et à l’indication. Un résultat obtenu avec une souche ne prouve pas l’efficacité de tous les produits.",en:"Probiotic effects are strain-, dose- and indication-specific. A result for one strain does not prove that all products work.",pt:"Os efeitos dos probióticos dependem da estirpe, da dose e da indicação. Um resultado com uma estirpe não prova que todos os produtos funcionem."},limits:{fr:"La catégorie est hétérogène; les preuves varient selon le problème étudié et la formulation. Les bénéfices ne peuvent pas être généralisés à la santé intestinale dans son ensemble.",en:"This is a heterogeneous category; evidence varies by condition and formulation. Benefits cannot be generalized to gut health as a whole.",pt:"Esta é uma categoria heterogénea; a evidência varia consoante o problema e a formulação. Os benefícios não podem ser generalizados para toda a saúde intestinal."},safety:{fr:"Souvent bien tolérés chez les personnes en bonne santé, mais un avis médical est important en cas d’immunodépression ou de maladie grave.",en:"Often well tolerated in healthy people, but medical advice is important for people who are immunocompromised or seriously ill.",pt:"São frequentemente bem tolerados por pessoas saudáveis, mas é importante obter aconselhamento médico em caso de imunossupressão ou doença grave."},sources:[{label:"NCCIH — Probiotics: What You Need To Know",url:"https://www.nccih.nih.gov/health/probiotics-what-you-need-to-know"}]},
 {id:"curcumin",names:{fr:"Curcumine / curcuma",en:"Curcumin / turmeric",pt:"Curcumina / curcuma"},aliases:["curcumin","turmeric","curcuma","curcuma","curcumina"],category:"herbs",status:"review",certainty:"low",timing:{fr:"Suivez les instructions du produit; les formulations varient fortement et certaines ajoutent de la pipérine pour modifier l’absorption. Aucun horaire universel n’est établi.",en:"Follow product instructions; formulations vary widely and some add piperine to alter absorption. No universal timing is established.",pt:"Siga as instruções do produto; as formulações variam muito e algumas incluem piperina para alterar a absorção. Não existe um horário universal estabelecido."},claim:{fr:"Certaines études suggèrent un soulagement possible de symptômes d’arthrose avec des formulations spécifiques, mais les preuves restent limitées et ne s’appliquent pas à tous les produits au curcuma.",en:"Some studies suggest possible relief of osteoarthritis symptoms with specific formulations, but evidence remains limited and does not apply to every turmeric product.",pt:"Alguns estudos sugerem possível alívio de sintomas de osteoartrose com formulações específicas, mas a evidência continua limitada e não se aplica a todos os produtos de curcuma."},limits:{fr:"La biodisponibilité varie selon la formulation; les essais sont souvent petits et de courte durée. Le curcuma alimentaire n’équivaut pas à un extrait concentré.",en:"Bioavailability varies by formulation; trials are often small and short. Culinary turmeric is not equivalent to a concentrated extract.",pt:"A biodisponibilidade varia com a formulação; os ensaios são frequentemente pequenos e curtos. A curcuma usada na alimentação não equivale a um extrato concentrado."},safety:{fr:"Des atteintes hépatiques rares ont été rapportées avec certains produits concentrés. Prudence en cas de maladie biliaire, de traitement anticoagulant ou de médicament; demander conseil au pharmacien.",en:"Rare liver injuries have been reported with some concentrated products. Use caution with biliary disease, anticoagulants or other medicines; ask a pharmacist.",pt:"Foram relatados casos raros de lesão hepática com alguns produtos concentrados. Tenha cuidado em caso de doença biliar, anticoagulantes ou outros medicamentos; consulte um farmacêutico."},sources:[{label:"NCCIH — Turmeric",url:"https://www.nccih.nih.gov/health/turmeric"}]},
 {id:"electrolytes",names:{fr:"Électrolytes",en:"Electrolytes",pt:"Eletrólitos"},aliases:["electrolytes","électrolytes","electrolyte","eletrólitos","electrolitos","sodium","sodio","sódio"],category:"performance",status:"review",certainty:"not_assessed",timing:{fr:"Peuvent être utiles pendant ou après un effort prolongé, une forte chaleur ou une transpiration importante. Pour une séance courte et modérée, l’eau et les repas suffisent souvent.",en:"May be useful during or after prolonged exercise, heat exposure or heavy sweating. For short, moderate sessions, water and meals are often sufficient.",pt:"Podem ser úteis durante ou após exercício prolongado, calor intenso ou transpiração elevada. Em sessões curtas e moderadas, a água e as refeições são muitas vezes suficientes."},claim:{fr:"Les boissons ou produits électrolytiques peuvent aider à remplacer les pertes de sodium et d’autres minéraux dans certaines conditions d’exercice. L’utilité dépend de la durée, de la intensidade e da transpiração.",en:"Electrolyte products can help replace sodium and other mineral losses in some exercise conditions. Usefulness depends on duration, intensity and sweating.",pt:"Produtos com eletrólitos podem ajudar a repor perdas de sódio e outros minerais em certas condições de exercício. A utilidade depende da duração, intensidade e transpiração."},limits:{fr:"Les besoins varient beaucoup. Les produits peuvent contenir du sucre ou beaucoup de sodium; ils ne sont pas nécessaires à chaque séance.",en:"Needs vary widely. Products may contain sugar or substantial sodium; they are not necessary for every workout.",pt:"As necessidades variam bastante. Os produtos podem conter açúcar ou muito sódio; não são necessários em todos os treinos."},safety:{fr:"Les personnes souffrant de maladies rénales, cardiaques ou d’hypertension doivent demander conseil avant d’augmenter fortement leur apport en sodium ou potassium.",en:"People with kidney or heart disease or hypertension should seek advice before substantially increasing sodium or potassium intake.",pt:"Pessoas com doença renal, cardíaca ou hipertensão devem pedir aconselhamento antes de aumentar muito a ingestão de sódio ou potássio."},sources:[{label:"NIH ODS — Exercise and Athletic Performance",url:"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"}]},
 {id:"citrulline",names:{fr:"L-citrulline",en:"L-citrulline",pt:"L-citrulina"},aliases:["citrulline","citrulina","l-citrulline","l-citrulina","citrulline malate"],category:"performance",status:"review",certainty:"low",timing:{fr:"Les études utilisent généralement une prise avant l’exercice, mais les protocoles et résultats varient. Le moment optimal et le bénéfice pratique ne sont pas solidement établis.",en:"Studies often use pre-exercise dosing, but protocols and results vary. Optimal timing and practical benefit are not firmly established.",pt:"Os estudos usam frequentemente toma antes do exercício, mas os protocolos e resultados variam. O horário ideal e o benefício prático não estão solidamente estabelecidos."},claim:{fr:"La citrulline peut influencer la disponibilité de l’oxyde nitrique, mais les données sur la performance sont mixtes et dépendent du type d’exercice et de la formulation.",en:"Citrulline can affect nitric oxide availability, but performance evidence is mixed and depends on exercise type and formulation.",pt:"A citrulina pode influenciar a disponibilidade de óxido nítrico, mas a evidência sobre desempenho é mista e depende do tipo de exercício e da formulação."},limits:{fr:"Les études sont souvent petites et les protocoles diffèrent; un mécanisme physiologique plausible ne garantit pas un gain mesurable de performance.",en:"Studies are often small and protocols differ; a plausible physiological mechanism does not guarantee measurable performance gains.",pt:"Os estudos são frequentemente pequenos e os protocolos diferem; um mecanismo fisiológico plausível não garante melhorias mensuráveis no desempenho."},safety:{fr:"Peut provoquer un inconfort digestif et potentiellement modifier la pression artérielle. Demandez conseil si vous prenez des médicaments cardiovasculaires ou antihypertenseurs.",en:"May cause digestive discomfort and could affect blood pressure. Seek advice if taking cardiovascular or blood-pressure medicines.",pt:"Pode causar desconforto digestivo e possivelmente afetar a pressão arterial. Peça aconselhamento se tomar medicamentos cardiovasculares ou para a tensão arterial."},sources:[{label:"NIH ODS — Exercise and Athletic Performance",url:"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"}]},
 {id:"glucosamine",names:{fr:"Glucosamine / chondroïtine",en:"Glucosamine / chondroitin",pt:"Glucosamina / condroitina"},aliases:["glucosamine","glucosamina","chondroitin","condroitina","chondroïtine"],category:"nutrients",status:"review",certainty:"low",timing:{fr:"Suivez l’étiquette du produit et l’avis d’un professionnel; aucune heure de prise universellement supérieure n’est établie.",en:"Follow the product label and professional advice; no universally superior time of day is established.",pt:"Siga o rótulo e o aconselhamento profissional; não existe uma hora do dia universalmente superior."},claim:{fr:"Les études sur l’arthrose donnent des résultats contradictoires. Certaines préparations peuvent aider certains patients, mais les recommandations et l’ampleur des bénéfices restent débattues.",en:"Studies on osteoarthritis give conflicting results. Some preparations may help some patients, but recommendations and benefit size remain debated.",pt:"Os estudos sobre osteoartrose apresentam resultados contraditórios. Algumas preparações podem ajudar alguns doentes, mas as recomendações e a dimensão dos benefícios continuam em debate."},limits:{fr:"Les résultats dépendent de la préparation et du critère mesuré; les preuves ne soutiennent pas une promesse générale de régénération du cartilage.",en:"Results depend on preparation and outcome measured; evidence does not support a general promise of cartilage regeneration.",pt:"Os resultados dependem da preparação e do parâmetro medido; a evidência não sustenta uma promessa geral de regeneração da cartilagem."},safety:{fr:"La glucosamine peut interagir avec la warfarine. Vérifiez la source (crustacés possibles) et demandez conseil en cas de diabète, traitement anticoagulant ou allergie.",en:"Glucosamine may interact with warfarin. Check the source (possible shellfish origin) and seek advice with diabetes, anticoagulant treatment or allergies.",pt:"A glucosamina pode interagir com a varfarina. Confirme a origem (pode derivar de crustáceos) e peça aconselhamento em caso de diabetes, anticoagulantes ou alergias."},sources:[{label:"NCCIH — Glucosamine and Chondroitin for Osteoarthritis",url:"https://www.nccih.nih.gov/health/glucosamine-and-chondroitin-for-osteoarthritis"}]},
 {id:"vitamink2",names:{fr:"Vitamine K2 (MK-7)",en:"Vitamin K2 (MK-7)",pt:"Vitamina K2 (MK-7)"},aliases:["vitamin k2","vitamine k2","vitamina k2","k2","mk7","mk 7","mk-7","vitamin k2 mk 7","vitamine k2 mk 7","vitamina k2 mk 7","menaquinone-7","ménaquinone-7","menaquinona-7"],category:"nutrients",status:"review",certainty:"not_assessed",timing:{fr:"Il n’existe pas d’heure universelle optimale. La vitamine K est liposoluble; suivre l’étiquette et la prendre avec un repas contenant des matières grasses peut favoriser son absorption. Ne modifiez jamais un traitement anticoagulant pour prendre un supplément.",en:"There is no universally optimal time. Vitamin K is fat-soluble; following the label and taking it with a meal containing fat may support absorption. Never change anticoagulant treatment to take a supplement.",pt:"Não existe uma hora ideal universal. A vitamina K é lipossolúvel; seguir o rótulo e tomá-la com uma refeição que contenha gordura pode favorecer a absorção. Nunca altere um tratamento anticoagulante para tomar um suplemento."},claim:{fr:"La vitamine K participe à la coagulation sanguine et au métabolisme osseux. Les données sur la supplémentation en K2 pour prévenir les fractures ou les maladies cardiovasculaires chez la population générale ne permettent pas de promettre un bénéfice clinique certain.",en:"Vitamin K contributes to blood clotting and bone metabolism. Evidence does not support promising a certain clinical benefit from K2 supplements for preventing fractures or cardiovascular disease in the general population.",pt:"A vitamina K participa na coagulação sanguínea e no metabolismo ósseo. A evidência não permite garantir um benefício clínico certo da suplementação com K2 na prevenção de fraturas ou doença cardiovascular na população geral."},limits:{fr:"La vitamine K2 comprend différentes ménaquinones; les résultats d’une forme ou d’une population ne s’appliquent pas automatiquement à la MK-7 ou à tout le monde. Les bénéfices cliniques restent incertains pour plusieurs usages proposés.",en:"Vitamin K2 includes different menaquinones; findings for one form or population do not automatically apply to MK-7 or everyone. Clinical benefits remain uncertain for several promoted uses.",pt:"A vitamina K2 inclui diferentes menaquinonas; os resultados de uma forma ou população não se aplicam automaticamente à MK-7 nem a todas as pessoas. Os benefícios clínicos continuam incertos para vários usos promovidos."},safety:{fr:"Interaction importante avec les antagonistes de la vitamine K, comme la warfarine et l’acénocoumarol: l’apport en vitamine K doit rester stable et tout changement doit être discuté avec le prescripteur. Demandez conseil en cas de traitement ou de maladie chronique.",en:"Important interaction with vitamin K antagonists such as warfarin: vitamin K intake should remain consistent and any change must be discussed with the prescriber. Seek advice if you take medicines or have a chronic condition.",pt:"Existe uma interação importante com antagonistas da vitamina K, como varfarina e acenocumarol: a ingestão de vitamina K deve manter-se estável e qualquer alteração deve ser discutida com o médico prescritor. Peça aconselhamento se toma medicamentos ou tem doença crónica."},sources:[{label:"NIH ODS — Vitamin K: Fact Sheet for Health Professionals",url:"https://ods.od.nih.gov/factsheets/VitaminK-HealthProfessional/"}]},
 {id:"vitaminc",names:{fr:"Vitamine C",en:"Vitamin C",pt:"Vitamina C"},aliases:["vitamin c","vitamine c","vitamina c","ascorbic acid","acide ascorbique","acido ascorbico"],category:"nutrients",status:"review",certainty:"not_assessed",timing:{fr:"Peut être prise à tout moment; avec un repas si elle irrite l’estomac. Il n’existe pas d’horaire universel optimal.",en:"Can be taken at any time; take with food if it irritates the stomach. There is no universally optimal time.",pt:"Pode ser tomada a qualquer hora; tome com alimentos se causar desconforto gástrico. Não existe um horário universal ideal."},claim:{fr:"La vitamine C est nécessaire à la synthèse du collagène et contribue au fonctionnement normal du système immunitaire. Une supplémentation corrige un apport insuffisant, mais ne prévient pas systématiquement les infections chez les personnes bien nourries.",en:"Vitamin C is needed for collagen synthesis and normal immune function. Supplementation corrects low intake but does not reliably prevent infections in well-nourished people.",pt:"A vitamina C é necessária à síntese de colagénio e ao funcionamento normal do sistema imunitário. A suplementação corrige uma ingestão insuficiente, mas não previne de forma fiável infeções em pessoas bem nutridas."},limits:{fr:"Les effets dépendent du statut nutritionnel et de l’indication. Les fortes doses ne garantissent pas de bénéfices supplémentaires.",en:"Effects depend on nutritional status and indication. High doses do not guarantee additional benefit.",pt:"Os efeitos dependem do estado nutricional e da indicação. Doses elevadas não garantem benefícios adicionais."},safety:{fr:"Des doses élevées peuvent provoquer des troubles digestifs et augmenter le risque de calculs rénaux chez certaines personnes. Prudence en cas d’hémochromatose.",en:"High doses may cause digestive symptoms and may increase kidney-stone risk in some people. Use caution with hemochromatosis.",pt:"Doses elevadas podem causar sintomas digestivos e aumentar o risco de cálculos renais em algumas pessoas. Cuidado em caso de hemocromatose."},sources:[{label:"NIH ODS — Vitamin C Fact Sheet",url:"https://ods.od.nih.gov/factsheets/VitaminC-HealthProfessional/"}]},
 {id:"calcium",names:{fr:"Calcium",en:"Calcium",pt:"Cálcio"},aliases:["calcium","calcio","cálcio","calcium supplement"],category:"nutrients",status:"review",certainty:"not_assessed",timing:{fr:"Si un supplément est nécessaire, les doses de carbonate de calcium se prennent généralement avec un repas; le citrate peut être pris avec ou sans nourriture. Fractionner les doses importantes selon les conseils professionnels.",en:"If supplementation is needed, calcium carbonate is generally taken with a meal; calcium citrate can be taken with or without food. Split larger doses according to professional advice.",pt:"Se for necessário suplementar, o carbonato de cálcio é geralmente tomado com uma refeição; o citrato pode ser tomado com ou sem alimentos. Divida doses elevadas segundo aconselhamento profissional."},claim:{fr:"Le calcium est essentiel aux os et aux fonctions musculaires et nerveuses. Les suplementos peuvent être utiles lorsque l’alimentation ne couvre pas les besoins, mais ne remplacent pas une évaluation de l’apport total.",en:"Calcium is essential for bones, muscle and nerve function. Supplements may help when diet does not meet needs, but total intake should be assessed first.",pt:"O cálcio é essencial para os ossos e para as funções musculares e nervosas. Os suplementos podem ajudar quando a alimentação não cobre as necessidades, mas deve avaliar-se primeiro a ingestão total."},limits:{fr:"Les bénéfices dépendent de l’apport alimentaire, de l’âge et du risque de fracture. Plus n’est pas nécessairement mieux.",en:"Benefits depend on dietary intake, age and fracture risk. More is not necessarily better.",pt:"Os benefícios dependem da ingestão alimentar, idade e risco de fratura. Mais não é necessariamente melhor."},safety:{fr:"Peut interagir avec la lévothyroxine et certains antibiotiques. Excès possibles de constipation et calculs rénaux; demander conseil en cas de maladie rénale.",en:"May interact with levothyroxine and some antibiotics. Excess intake can cause constipation and kidney stones; seek advice with kidney disease.",pt:"Pode interagir com levotiroxina e alguns antibióticos. O excesso pode causar obstipação e cálculos renais; peça aconselhamento em caso de doença renal."},sources:[{label:"NIH ODS — Calcium Fact Sheet",url:"https://ods.od.nih.gov/factsheets/Calcium-HealthProfessional/"}]},
 {id:"folate",names:{fr:"Folate / acide folique (B9)",en:"Folate / folic acid (B9)",pt:"Folato / ácido fólico (B9)"},aliases:["folate","folic acid","vitamin b9","vitamine b9","vitamina b9","acide folique","ácido fólico","acido folico"],category:"nutrients",status:"review",certainty:"not_assessed",timing:{fr:"Peut être pris à tout moment, avec ou sans repas. En cas de projet de grossesse, le moment de début et la dose doivent suivre les recommandations de santé publique locales.",en:"Can be taken at any time, with or without food. For pregnancy planning, follow local public-health guidance on when to start and the dose.",pt:"Pode ser tomado a qualquer hora, com ou sem alimentos. Ao planear uma gravidez, siga as recomendações locais de saúde pública sobre início e dose."},claim:{fr:"Les folates sont nécessaires à la formation des cellules. L’acide folique avant la conception et au début de la grossesse réduit le risque d’anomalies du tube neural; outras utilizações dépendent du statut et de l’indication.",en:"Folate is needed for cell formation. Folic acid before conception and in early pregnancy reduces neural-tube-defect risk; other uses depend on status and indication.",pt:"O folato é necessário à formação das células. O ácido fólico antes da conceção e no início da gravidez reduz o risco de defeitos do tubo neural; outras utilizações dependem do estado nutricional e da indicação."},limits:{fr:"Une supplémentation généralisée n’est pas nécessaire pour tous; des doses élevées peuvent masquer certains signes d’un déficit en vitamine B12.",en:"Universal supplementation is not necessary for everyone; high doses can mask signs of vitamin B12 deficiency.",pt:"A suplementação universal não é necessária para todos; doses elevadas podem mascarar sinais de deficiência de vitamina B12."},safety:{fr:"Respecter les doses recommandées et demander conseil en cas de traitement antiépileptique ou de maladie chronique.",en:"Follow recommended doses and seek advice with anti-seizure medicines or chronic conditions.",pt:"Respeite as doses recomendadas e peça aconselhamento se toma antiepiléticos ou tem doença crónica."},sources:[{label:"NIH ODS — Folate Fact Sheet",url:"https://ods.od.nih.gov/factsheets/Folate-HealthProfessional/"}]},
 {id:"selenium",names:{fr:"Sélénium",en:"Selenium",pt:"Selénio"},aliases:["selenium","selenium supplement","sélénium","selenio","selénio"],category:"nutrients",status:"review",certainty:"not_assessed",timing:{fr:"Aucun moment spécifique n’a démontré de supériorité. La priorité est d’éviter les apports excessifs et de tenir compte de l’alimentation.",en:"No specific timing has shown superiority. The priority is avoiding excessive intake and considering dietary sources.",pt:"Não foi demonstrada superioridade de um horário específico. A prioridade é evitar ingestões excessivas e considerar as fontes alimentares."},claim:{fr:"Le sélénium contribue au fonctionnement normal de certaines enzymes et de la thyroïde. Une supplémentation est surtout pertinente lorsque l’apport est insuffisant; elle n’améliore pas automatiquement l’énergie ou l’immunité.",en:"Selenium supports certain enzymes and normal thyroid function. Supplementation is mainly relevant when intake is inadequate; it does not automatically improve energy or immunity.",pt:"O selénio contribui para o funcionamento normal de certas enzimas e da tiroide. A suplementação é sobretudo relevante quando a ingestão é insuficiente; não melhora automaticamente a energia ou a imunidade."},limits:{fr:"La marge entre apport adéquat et excès peut être étroite. Les bénéfices chez les personnes non carencées sont incertains.",en:"The margin between adequate intake and excess can be narrow. Benefits in people without deficiency are uncertain.",pt:"A margem entre ingestão adequada e excesso pode ser estreita. Os benefícios em pessoas sem deficiência são incertos."},safety:{fr:"L’excès chronique peut provoquer chute des cheveux, ongles fragiles, haleine particulière et symptômes neurologiques. Éviter de cumuler plusieurs produits contenant du sélénium.",en:"Chronic excess may cause hair loss, brittle nails, garlic-like breath and neurological symptoms. Avoid stacking multiple selenium-containing products.",pt:"O excesso crónico pode causar queda de cabelo, unhas frágeis, hálito característico e sintomas neurológicos. Evite acumular vários produtos com selénio."},sources:[{label:"NIH ODS — Selenium Fact Sheet",url:"https://ods.od.nih.gov/factsheets/Selenium-HealthProfessional/"}]},
 {id:"coq10",names:{fr:"Coenzyme Q10 (CoQ10)",en:"Coenzyme Q10 (CoQ10)",pt:"Coenzima Q10 (CoQ10)"},aliases:["coq10","coenzyme q10","coenzyme q 10","coenzima q10","ubiquinone","ubiquinol","ubiquinona"],category:"nutrients",status:"review",certainty:"low",timing:{fr:"Souvent prise avec un repas contenant des matières grasses, car elle est liposoluble. Suivez l’étiquette; l’heure exacte n’est pas établie.",en:"Often taken with a meal containing fat because it is fat-soluble. Follow the label; the exact time is not established.",pt:"É frequentemente tomada com uma refeição que contenha gordura por ser lipossolúvel. Siga o rótulo; a hora exata não está estabelecida."},claim:{fr:"La CoQ10 participe à la production d’énergie cellulaire. Les preuves de bénéfice varient selon l’indication; elle n’est pas un traitement universel de la fatigue ni une garantie de performance sportive.",en:"CoQ10 participates in cellular energy production. Evidence varies by indication; it is not a universal treatment for fatigue or a guarantee of sports performance.",pt:"A CoQ10 participa na produção de energia celular. A evidência varia conforme a indicação; não é um tratamento universal para a fadiga nem garante melhor desempenho desportivo."},limits:{fr:"Les études sont hétérogènes et les résultats dépendent de la population et de l’objectif. Les effets cliniques ne sont pas établis pour de nombreux usages populaires.",en:"Studies are heterogeneous and results depend on population and outcome. Clinical benefits are not established for many popular uses.",pt:"Os estudos são heterogéneos e os resultados dependem da população e do objetivo. Os benefícios clínicos não estão estabelecidos para muitos usos populares."},safety:{fr:"Peut interagir avec la warfarine et certains traitements de la tension ou du diabète. Demandez conseil si vous prenez des médicaments.",en:"May interact with warfarin and some blood-pressure or diabetes medicines. Seek advice if you take medication.",pt:"Pode interagir com varfarina e alguns medicamentos para a tensão arterial ou diabetes. Peça aconselhamento se toma medicação."},sources:[{label:"NCCIH — Coenzyme Q10",url:"https://www.nccih.nih.gov/health/coenzyme-q10"}]},
 {id:"beetroot",names:{fr:"Betterave / nitrates",en:"Beetroot / dietary nitrates",pt:"Beterraba / nitratos"},aliases:["beetroot","beet root","betterave","beterraba","nitrate","nitrates","nitratos","beet juice","jus de betterave"],category:"performance",status:"review",certainty:"low",timing:{fr:"Les protocoles étudiés utilisent souvent une prise quelques heures avant l’exercice, mais la teneur en nitrates varie fortement selon les produits. Ne pas extrapoler à un jus ordinaire sans dosage.",en:"Studies often use a dose a few hours before exercise, but nitrate content varies widely. Do not assume ordinary juice provides the studied dose.",pt:"Os protocolos estudados usam frequentemente uma toma algumas horas antes do exercício, mas o teor de nitratos varia muito. Não presuma que um sumo comum fornece a dose estudada."},claim:{fr:"Les nitrates alimentaires peuvent améliorer modestement l’efficacité de l’exercice dans certaines situations, mais les résultats varient selon le type d’effort, l’entraînement et le produit.",en:"Dietary nitrates may modestly improve exercise efficiency in some situations, but results vary by exercise type, training status and product.",pt:"Os nitratos alimentares podem melhorar modestamente a eficiência do exercício em algumas situações, mas os resultados variam com o tipo de esforço, treino e produto."},limits:{fr:"Les effets ne sont pas constants, notamment chez les sportifs très entraînés. La dose réelle de nitrates est souvent mal indiquée.",en:"Effects are inconsistent, particularly in highly trained athletes. Actual nitrate dose is often poorly labelled.",pt:"Os efeitos são inconsistentes, sobretudo em atletas muito treinados. A dose real de nitratos é muitas vezes pouco clara no rótulo."},safety:{fr:"Peut abaisser la tension artérielle et interagir avec certains médicaments. Les bains de bouche antibactériens peuvent modifier la conversion des nitrates; demander conseil en cas de maladie ou traitement.",en:"May lower blood pressure and interact with medicines. Antibacterial mouthwash can affect nitrate conversion; seek advice with medical conditions or treatment.",pt:"Pode baixar a tensão arterial e interagir com medicamentos. Os elixires bucais antibacterianos podem alterar a conversão dos nitratos; peça aconselhamento se tiver doença ou medicação."},sources:[{label:"NIH ODS — Exercise and Athletic Performance",url:"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"}]},
 {id:"hmb",names:{fr:"HMB",en:"HMB",pt:"HMB"},aliases:["hmb","beta-hydroxy beta-methylbutyrate","β-hydroxy β-methylbutyrate"],category:"performance",status:"review",certainty:"low",timing:{fr:"Les études utilisent différents protocoles quotidiens; aucune fenêtre universelle autour de l’entraînement n’est clairement établie. Suivez l’étiquette et l’avis professionnel.",en:"Studies use different daily protocols; no universal workout-timing window is clearly established. Follow the label and professional advice.",pt:"Os estudos usam diferentes protocolos diários; não está estabelecida uma janela universal em torno do treino. Siga o rótulo e o aconselhamento profissional."},claim:{fr:"Le HMB est un métabolite de la leucine étudié pour la masse musculaire et la récupération. Les résultats sont mixtes et un bénéfice supplémentaire chez les adultes entraînés n’est pas établi de manière constante.",en:"HMB is a leucine metabolite studied for muscle and recovery. Findings are mixed, and consistent added benefit in trained adults is not established.",pt:"O HMB é um metabolito da leucina estudado para massa muscular e recuperação. Os resultados são mistos e não está demonstrado de forma consistente um benefício adicional em adultos treinados."},limits:{fr:"Les études diffèrent par les populations, l’entraînement et la qualité méthodologique. Ne remplace ni l’entraînement progressif ni un apport protéique suffisant.",en:"Studies differ in population, training and methodology. It does not replace progressive training or adequate protein intake.",pt:"Os estudos diferem na população, treino e metodologia. Não substitui o treino progressivo nem uma ingestão adequada de proteína."},safety:{fr:"Les données à long terme sont limitées. En cas de maladie chronique, grossesse, allaitement ou traitement, demander un avis professionnel.",en:"Long-term data are limited. Seek professional advice with chronic illness, pregnancy, breastfeeding or medication.",pt:"Os dados a longo prazo são limitados. Peça aconselhamento profissional em caso de doença crónica, gravidez, amamentação ou medicação."},sources:[{label:"NIH ODS — Exercise and Athletic Performance",url:"https://ods.od.nih.gov/factsheets/ExerciseAndAthleticPerformance-HealthProfessional/"}]},
 {id:"l-theanine",names:{fr:"L-théanine",en:"L-theanine",pt:"L-teanina"},aliases:["l-theanine","theanine","théanine","teanina","l teanina"],category:"herbs",status:"review",certainty:"low",timing:{fr:"Les études ne définissent pas d’horaire universel. Évitez de considérer son association avec la caféine comme une garantie d’amélioration cognitive ou du sommeil.",en:"Studies do not establish a universal timing. Do not assume combining it with caffeine guarantees better cognition or sleep.",pt:"Os estudos não estabelecem um horário universal. Não presuma que a associação com cafeína garante melhor cognição ou sono."},claim:{fr:"La L-théanine est un acide aminé présent dans le thé. Les recherches sur le stress, l’attention et le sommeil restent limitées et ne permettent pas de garantir un effet clinique fiable.",en:"L-theanine is an amino acid found in tea. Research on stress, attention and sleep remains limited and does not establish a reliable clinical effect.",pt:"A L-teanina é um aminoácido presente no chá. A investigação sobre stress, atenção e sono continua limitada e não permite garantir um efeito clínico fiável."},limits:{fr:"Les études sont souvent petites et les préparations/doses varient. Les effets d’un complément ne sont pas équivalents à ceux du thé.",en:"Studies are often small and preparations/doses vary. Supplement effects are not equivalent to drinking tea.",pt:"Os estudos são frequentemente pequenos e as preparações/doses variam. Os efeitos de um suplemento não são equivalentes aos do chá."},safety:{fr:"Les données de sécurité à long terme sont limitées. Prudence avec les sédatifs, les antihypertenseurs, pendant la grossesse ou l’allaitement.",en:"Long-term safety data are limited. Use caution with sedatives, blood-pressure medicines, pregnancy or breastfeeding.",pt:"Os dados de segurança a longo prazo são limitados. Tenha cuidado com sedativos, medicamentos para a tensão arterial, gravidez ou amamentação."},sources:[{label:"NCCIH — Using Dietary Supplements Wisely",url:"https://www.nccih.nih.gov/health/using-dietary-supplements-wisely"}]},
 {id:"inositol",names:{fr:"Inositol",en:"Inositol",pt:"Inositol"},aliases:["inositol","myo-inositol","myo inositol","d-chiro-inositol"],category:"nutrients",status:"review",certainty:"low",timing:{fr:"Les protocoles varient selon l’indication et la formulation. Suivez les recommandations du professionnel de santé plutôt qu’un horaire générique.",en:"Protocols vary by indication and formulation. Follow a healthcare professional's advice rather than a generic schedule.",pt:"Os protocolos variam consoante a indicação e a formulação. Siga as orientações de um profissional de saúde em vez de um horário genérico."},claim:{fr:"L’inositol a été étudié notamment dans le syndrome des ovaires polykystiques et certains contextes métaboliques ou psychiatriques. Les preuves et recommandations varient selon l’indication; il ne convient pas à une promesse générale de santé.",en:"Inositol has been studied particularly in PCOS and some metabolic or psychiatric contexts. Evidence and recommendations vary by indication; it is not a general health solution.",pt:"O inositol foi estudado sobretudo na síndrome dos ovários poliquísticos e em alguns contextos metabólicos ou psiquiátricos. A evidência e as recomendações variam consoante a indicação; não é uma solução geral de saúde."},limits:{fr:"Les résultats ne sont pas uniformes et les formulations ne sont pas interchangeables. L’usage doit être lié à un objectif clinique précis.",en:"Results are inconsistent and formulations are not interchangeable. Use should be tied to a specific clinical goal.",pt:"Os resultados não são uniformes e as formulações não são intercambiáveis. A utilização deve estar ligada a um objetivo clínico específico."},safety:{fr:"Demander un avis médical en cas de grossesse, traitement psychiatrique, diabète ou autre maladie chronique.",en:"Seek medical advice with pregnancy, psychiatric medication, diabetes or other chronic conditions.",pt:"Peça aconselhamento médico em caso de gravidez, medicação psiquiátrica, diab function t(k){return copy[document.getElementById("language").value][k]}
function catName(c){return t(c)}
function renderGoals(){let box=document.getElementById("goals");let goals=["all","muscle","sleep","energy","performance","joints","nutrition"];box.innerHTML="";goals.forEach(g=>{let b=document.createElement("button");b.className="chip"+(activeGoal===g?" active":"");let key=g==="all"?"goalAll":"goal"+g.charAt(0).toUpperCase()+g.slice(1);b.textContent=copy[document.getElementById("language").value][key];b.onclick=()=>{activeGoal=g;renderGoals();renderResults()};box.appendChild(b)})}
function setLanguage(){let l=document.getElementById("language").value;document.documentElement.lang=l;["langLabel","eyebrow","headline","intro","searchBtn","resultsTitle","safety","method","footer"].forEach(id=>{let key={langLabel:"lang",searchBtn:"search",resultsTitle:"results"}[id]||id; if(copy[l][key])document.getElementById(id).textContent=copy[l][key]});document.getElementById("search").placeholder=copy[l].placeholder;document.getElementById("goalsTitle").textContent=copy[l].goalsTitle;renderGoals();renderFilters();renderResults();renderDetail()}
function renderFilters(){let box=document.getElementById("filters");let cats=["all","performance","nutrients","herbs"];box.innerHTML="";cats.forEach(c=>{let b=document.createElement("button");b.className="chip"+(activeCategory===c?" active":"");b.textContent=t(c);b.onclick=()=>{activeCategory=c;renderFilters();renderResults()};box.appendChild(b)})}
function normalizeText(v){return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim().toLowerCase()}

 nutrition:["nutrient","nutriments","nutrientes","deficiency","carence","deficiencia","vitamin","vitamine","vitamina"]
};
function visible(){let raw=document.getElementById("search").value.trim(),q=normalizeText(raw);let goalFromQuery=Object.keys(queryGoalMap).find(g=>queryGoalMap[g].some(term=>normalizeText(term)===q));let effectiveGoal=activeGoal!=="all"?activeGoal:(goalFromQuery||"all");return db.filter(x=>{let fields=[x.names.fr,x.names.en,x.names.pt,...(x.aliases||[])].map(normalizeText).join(" ");let id=normalizeText(x.id);let categoryOk=activeCategory==="all"||x.category===activeCategory;let goalOk=effectiveGoal==="all"||(goalIds[effectiveGoal]||[]).some(v=>id.includes(normalizeText(v))||normalizeText(v).includes(id));let queryOk=!q||fields.includes(q)||normalizeText(x.id).includes(q)||q.split(" ").every(token=>fields.includes(token));return categoryOk&&goalOk&&queryOk})}
function renderResults(){let box=document.getElementById("results");box.innerHTML="";let rows=visible();if(!rows.length){box.innerHTML='<div class="empty">'+t("empty")+'</div>';return}rows.forEach(x=>{let b=document.createElement("button");b.className="result"+(x.id===selectedId?" selected":"");let title=document.createElement("strong");title.textContent=x.names[document.getElementById("language").value];let small=document.createElement("small");small.textContent=catName(x.category);b.append(title,small);b.onclick=()=>{selectedId=x.id;renderResults();renderDetail()};box.appendChild(b)})}
function renderDetail(){let x=db.find(x=>x.id===selectedId)||db[0],l=document.getElementById("language").value;let certainty=x.certainty==="moderate"?t("moderate"):x.certainty==="low"?t("low"):t("not_assessed");let d=document.getElementById("detail");d.innerHTML="";let title=document.createElement("h2");title.textContent=x.names[l];let pill=document.createElement("span");pill.className="pill caution";pill.textContent=t("review");d.append(title,pill);
